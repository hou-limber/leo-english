<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF8C42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leo英语">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://aka.doubaocdn.com/s/nqluoPMBLY">
<link rel="icon" type="image/png" href="https://aka.doubaocdn.com/s/nqluoPMBLY">
<title>Leo 英语小乐园</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* ===== 设计变量 ===== */
:root {
  --bg: #FFF8E7;
  --bg-soft: #FFF3D6;
  --card: #FFFFFF;
  --primary: #FFB800;
  --primary-dark: #F5A623;
  --secondary: #4ECDC4;
  --pink: #FF6B9D;
  --blue: #5B9DFB;
  --purple: #A78BFA;
  --green: #6BCB77;
  --orange: #FF8C42;
  --red: #FF6B6B;
  --text: #2D3436;
  --text-light: #8B95A0;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius: 24px;
  --radius-sm: 16px;
  --nav-h: 72px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  user-select: none;
}

body {
  background:
    radial-gradient(circle at 10% 0%, rgba(255,184,0,0.12) 0%, transparent 40%),
    radial-gradient(circle at 90% 20%, rgba(78,205,196,0.1) 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(255,107,157,0.08) 0%, transparent 50%),
    var(--bg);
}

#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(var(--nav-h) + 24px);
  position: relative;
}

/* ===== 通用组件 ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 20px;
  font-family: 'Fredoka', 'Nunito', sans-serif;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  text-decoration: none;
}
.btn:active { transform: scale(0.95); }

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  font-size: 22px;
  padding: 18px 40px;
  box-shadow: 0 6px 0 #E09600, 0 8px 20px rgba(255,184,0,0.4);
  border-radius: 28px;
}
.btn-primary:active { box-shadow: 0 2px 0 #E09600, 0 4px 10px rgba(255,184,0,0.4); transform: translateY(4px) scale(0.98); }

.btn-secondary {
  background: var(--card);
  color: var(--text);
  font-size: 18px;
  padding: 14px 28px;
  box-shadow: var(--shadow);
  border: 3px solid var(--bg-soft);
}

.btn-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--card);
  box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none;
  transition: transform 0.15s;
}
.btn-icon:active { transform: scale(0.9); }

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}

/* ===== 底部导航 ===== */
#bottom-nav {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; max-width: 520px;
  height: var(--nav-h);
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-around;
  align-items: center;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  cursor: pointer; padding: 8px 16px;
  border-radius: 16px;
  transition: background 0.2s;
  color: var(--text-light);
  font-size: 11px; font-weight: 700;
  font-family: 'Fredoka', sans-serif;
}
.nav-item.active { color: var(--primary-dark); }
.nav-item.active .nav-icon { background: var(--bg-soft); }
.nav-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}

/* ===== 首页 ===== */
.home-header {
  padding: 24px 20px 16px;
  display: flex; align-items: center; gap: 16px;
}
.mascot-avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--bg-soft);
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: var(--shadow);
  cursor: pointer;
  border: 3px solid #fff;
  display: flex; align-items: center; justify-content: center;
}
.mascot-avatar img { width: 100%; height: 100%; object-fit: cover; }
.mascot-avatar:active { animation: leoWiggle 0.5s ease; }
.home-greeting h1 {
  font-family: 'Fredoka', sans-serif;
  font-size: 24px; font-weight: 700;
  color: var(--text);
}
.home-greeting p {
  font-size: 14px; color: var(--text-light);
  margin-top: 2px;
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 0 20px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 14px 8px;
  text-align: center;
  box-shadow: var(--shadow);
}
.stat-num {
  font-family: 'Fredoka', sans-serif;
  font-size: 28px; font-weight: 700;
  line-height: 1;
}
.stat-label {
  font-size: 12px; color: var(--text-light);
  margin-top: 4px; font-weight: 600;
}

.lesson-card {
  margin: 0 20px 20px;
  background: linear-gradient(135deg, #FFE8A3 0%, #FFD166 100%);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.lesson-card::after {
  content: '';
  position: absolute;
  right: -20px; top: -20px;
  width: 120px; height: 120px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
}
.lesson-badge {
  display: inline-block;
  background: rgba(255,255,255,0.7);
  color: var(--primary-dark);
  font-size: 12px; font-weight: 800;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 10px;
}
.lesson-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 26px; font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.lesson-sub {
  font-size: 14px; color: rgba(45,52,54,0.7);
  margin-bottom: 18px;
  font-weight: 600;
}
.lesson-start-btn {
  background: #fff;
  color: var(--primary-dark);
  font-size: 20px; font-weight: 700;
  padding: 14px 32px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  font-family: 'Fredoka', sans-serif;
  transition: transform 0.15s;
  position: relative; z-index: 1;
}
.lesson-start-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }

.lesson-done {
  background: linear-gradient(135deg, #A8E6CF 0%, #6BCB77 100%);
}
.lesson-done .lesson-title { color: #1B5E20; }
.lesson-done .lesson-start-btn { color: #2E7D32; }

.quick-section {
  padding: 0 20px;
}
.quick-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 18px; font-weight: 700;
  margin-bottom: 12px;
  color: var(--text);
}
.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.quick-item {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 18px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.15s;
  display: flex; align-items: center; gap: 12px;
}
.quick-item:active { transform: scale(0.97); }
.quick-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.quick-item span {
  font-family: 'Fredoka', sans-serif;
  font-size: 16px; font-weight: 600;
}

.home-section {
  padding: 0 20px;
  margin-top: 20px;
}

/* 日历 */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-dow {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-light);
  padding: 4px 0;
}
.cal-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  color: var(--text-light);
}
.cal-done {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  font-weight: 700;
}
.cal-today {
  border: 2px solid var(--secondary);
}
.cal-empty { aspect-ratio: 1; }

/* 成就徽章 */
.achievement-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 2px 12px;
  -webkit-overflow-scrolling: touch;
}
.achievement {
  flex-shrink: 0;
  width: 72px;
  text-align: center;
}
.achievement-icon {
  width: 52px; height: 52px;
  border-radius: 50%;
  margin: 0 auto 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.achievement.locked .achievement-icon {
  opacity: 0.25;
  filter: grayscale(1);
}
.achievement.locked .achievement-name {
  color: var(--text-light);
  opacity: 0.4;
}
.achievement-name {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}

/* ===== 课程页 ===== */
.lesson-container {
  padding: 20px;
  min-height: calc(100vh - var(--nav-h));
  display: flex;
  flex-direction: column;
}
.lesson-top-bar {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px;
}
.lesson-progress-track {
  flex: 1;
  height: 12px;
  background: var(--bg-soft);
  border-radius: 6px;
  overflow: hidden;
}
.lesson-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  border-radius: 6px;
  transition: width 0.4s ease;
}
.lesson-step-label {
  font-size: 13px; font-weight: 700;
  color: var(--text-light);
  white-space: nowrap;
}

.lesson-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}

/* 暖场 */
.warmup-mascot {
  width: 160px; height: 160px;
  border-radius: 50%;
  background: var(--bg-soft);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  animation: bounce 2s ease-in-out infinite;
}
.warmup-mascot img { width: 100%; height: 100%; object-fit: cover; }
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
.warmup-text {
  font-family: 'Fredoka', sans-serif;
  font-size: 28px; font-weight: 700;
  text-align: center;
  color: var(--text);
}
.warmup-sub {
  font-size: 16px; color: var(--text-light);
  text-align: center; font-weight: 600;
}

/* 单词卡 */
.word-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 28px 24px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  position: relative;
}
.word-card-img {
  width: 140px; height: 140px;
  margin: 0 auto 16px;
  object-fit: contain;
}
.word-card-color-swatch {
  width: 120px; height: 120px;
  border-radius: 50%;
  margin: 0 auto 16px;
  box-shadow: inset 0 -4px 12px rgba(0,0,0,0.15), 0 4px 16px rgba(0,0,0,0.1);
}
.word-card-num {
  font-family: 'Fredoka', sans-serif;
  font-size: 100px; font-weight: 700;
  line-height: 1;
  margin-bottom: 8px;
}
.word-en {
  font-family: 'Fredoka', sans-serif;
  font-size: 36px; font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.word-zh {
  font-size: 18px; color: var(--text-light);
  font-weight: 600;
  margin-bottom: 16px;
}
.word-example {
  font-size: 14px; color: var(--secondary);
  font-style: italic;
  font-weight: 600;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 2px dashed var(--bg-soft);
}
.word-counter {
  position: absolute;
  top: 16px; right: 20px;
  font-family: 'Fredoka', sans-serif;
  font-size: 16px; font-weight: 700;
  color: var(--text-light);
}
.speak-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--secondary), #3DB8B0);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 #2A9D8F, 0 6px 16px rgba(78,205,196,0.4);
  transition: transform 0.15s;
  margin: 0 auto;
}
.speak-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2A9D8F; }
.speak-btn.playing { animation: pulse 1s ease infinite; }
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.mic-btn {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--pink), #E84393);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 #C2185B, 0 6px 16px rgba(255,107,157,0.4);
  transition: transform 0.15s;
}
.mic-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #C2185B; }
.mic-btn.recording {
  animation: micPulse 1s ease infinite;
  background: linear-gradient(135deg, var(--red), #E53935);
}
@keyframes micPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 4px 0 #B71C1C, 0 0 0 0 rgba(255,107,107,0.5); }
  50% { transform: scale(1.08); box-shadow: 0 4px 0 #B71C1C, 0 0 0 14px rgba(255,107,107,0); }
}

/* 自然拼读 */
.phonics-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 32px 24px;
  width: 100%;
  max-width: 360px;
  text-align: center;
}
.phonics-letter {
  font-family: 'Fredoka', sans-serif;
  font-size: 120px; font-weight: 700;
  line-height: 1;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.phonics-sound {
  font-family: 'Fredoka', sans-serif;
  font-size: 28px; font-weight: 600;
  color: var(--purple);
  margin-bottom: 20px;
}
.phonics-examples {
  display: flex; flex-wrap: wrap;
  gap: 8px; justify-content: center;
  margin-top: 16px;
}
.phonics-example-tag {
  background: var(--bg-soft);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 16px; font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: transform 0.15s;
}
.phonics-example-tag:active { transform: scale(0.95); }

/* 游戏 */
.game-instruction {
  font-family: 'Fredoka', sans-serif;
  font-size: 22px; font-weight: 700;
  text-align: center;
  color: var(--text);
}
.game-listen-btn {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--blue), #4A8AE8);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 5px 0 #3A7BD5, 0 8px 20px rgba(91,157,251,0.4);
  transition: transform 0.15s;
  margin: 0 auto;
}
.game-listen-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #3A7BD5; }
.game-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  width: 100%;
  max-width: 380px;
}
.game-option {
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s;
  border: 4px solid transparent;
}
.game-option:active { transform: scale(0.95); }
.game-option.correct {
  border-color: var(--green);
  background: #E8F5E9;
  animation: correctPop 0.4s ease;
}
.game-option.wrong {
  border-color: var(--blue);
  background: #E3F2FD;
  animation: shake 0.4s ease;
}

.game-mode-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: transform 0.15s;
  width: 100%;
  max-width: 360px;
}
.game-mode-card:active { transform: scale(0.97); }
.game-mode-icon {
  width: 56px; height: 56px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.game-option-textonly {
  padding: 20px 16px;
}
.game-option-textonly .game-option-text {
  font-size: 22px;
  font-weight: 700;
}
@keyframes correctPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.game-option img {
  width: 80px; height: 80px;
  object-fit: contain;
  margin-bottom: 8px;
}
.game-option-text {
  font-family: 'Fredoka', sans-serif;
  font-size: 22px; font-weight: 700;
  color: var(--text);
}
.game-option-color {
  width: 60px; height: 60px;
  border-radius: 50%;
  margin: 0 auto 8px;
  box-shadow: inset 0 -3px 8px rgba(0,0,0,0.15);
}
.game-round-info {
  font-size: 14px; font-weight: 700;
  color: var(--text-light);
  text-align: center;
}
.game-score-stars {
  display: flex; gap: 6px; justify-content: center;
}

/* 奖励页 */
.reward-container {
  text-align: center;
  padding: 40px 20px;
}
.reward-mascot {
  width: 140px; height: 140px;
  border-radius: 50%;
  margin: 0 auto 20px;
  background: var(--bg-soft);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  animation: cheer 0.8s ease infinite alternate;
  display: flex; align-items: center; justify-content: center;
}
.reward-mascot img { width: 100%; height: 100%; object-fit: cover; }
@keyframes cheer {
  from { transform: rotate(-5deg) scale(1); }
  to { transform: rotate(5deg) scale(1.05); }
}
.reward-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 32px; font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 8px;
}
.reward-sub {
  font-size: 16px; color: var(--text-light);
  font-weight: 600;
  margin-bottom: 24px;
}
.reward-stars {
  display: flex; justify-content: center; gap: 12px;
  margin-bottom: 32px;
}
.reward-star {
  font-size: 48px;
  animation: starPop 0.5s ease backwards;
}
.reward-star:nth-child(1) { animation-delay: 0.2s; }
.reward-star:nth-child(2) { animation-delay: 0.4s; }
.reward-star:nth-child(3) { animation-delay: 0.6s; }
@keyframes starPop {
  0% { transform: scale(0) rotate(-180deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

/* 彩带 */
.confetti {
  position: fixed;
  top: -10px;
  width: 10px; height: 10px;
  z-index: 200;
  pointer-events: none;
  animation: confettiFall 3s linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ===== 单词库 ===== */
.page-header {
  padding: 24px 20px 16px;
}
.page-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 28px; font-weight: 700;
  color: var(--text);
}
.page-sub {
  font-size: 14px; color: var(--text-light);
  margin-top: 4px; font-weight: 600;
}

.category-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding: 0 20px;
}
.category-card {

/* 单词详情弹层 */
.modal-overlay {

}

/* ===== 拼读页 ===== */
.letter-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 0 20px;
}
.letter-tile {
  aspect-ratio: 1;
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform 0.15s;
  font-family: 'Fredoka', sans-serif;
}
.letter-tile:active { transform: scale(0.93); }
.letter-tile-big {
  font-size: 32px; font-weight: 700;
  line-height: 1;
}
.letter-tile-sound {
  font-size: 11px; color: var(--text-light);
  margin-top: 4px; font-weight: 600;
}
.letter-tile.learned {
  background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
  border: 3px solid var(--green);
}
.letter-tile.learned .letter-tile-big { color: #2E7D32; }
.letter-tile.current {
  background: linear-gradient(135deg, #FFF8E1, #FFECB3);
  border: 3px solid var(--primary);
  animation: tilePulse 1.6s ease infinite;
}
.letter-tile.current .letter-tile-big { color: var(--primary-dark); }
.letter-tile.locked {
  opacity: 0.5;
  cursor: default;
}
.letter-tile.locked .letter-tile-big { color: var(--text-light); }
.letter-tile.locked .letter-tile-sound { display: none; }
@keyframes tilePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,184,0,0.45); }
  50% { box-shadow: 0 0 0 10px rgba(255,184,0,0); }
}
.letter-check {
  position: absolute;
  top: 6px; right: 6px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--green);
  display: flex; align-items: center; justify-content: center;
}
.letter-lock {
  position: absolute;
  top: 6px; right: 6px;
  width: 20px; height: 20px;
  color: var(--text-light);
  display: flex; align-items: center; justify-content: center;
}
.letter-tile { position: relative; }

/* 拼读学习进度与今日字母 */

}

/* ===== 卡通动效 ===== */
@keyframes leoPopIn {
  0% { transform: scale(0) rotate(-12deg); opacity: 0; }
  60% { transform: scale(1.15) rotate(4deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); }
}

@keyframes leoWiggle {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-8deg) scale(1.05); }

}

  to { opacity: 1; transform: translateY(0); }
}

}
.spell-tile:active { transform: scale(0.9); }

}

/* ===== 翻翻乐 ===== */

  gap: 10px;
  padding: 6px 20px 0;
}
.mem-card {

}
.mem-inner {
  position: relative;
  width: 100%; height: 100%;
  transition: transform 0.45s cubic-bezier(0.4, 0.2, 0.2, 1);
  transform-style: preserve-3d;
}
.mem-card.flipped .mem-inner { transform: rotateY(180deg); }
.mem-front, .mem-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
}

  background: linear-gradient(135deg, var(--purple), #A78BFA);

}
.mem-back {
  background: var(--card);

  transform: rotateY(180deg);
  border: 3px solid var(--secondary);
  overflow: hidden;
}
.mem-card.matched .mem-back {

  box-shadow: 0 4px 12px rgba(107,203,119,0.5);
}
.mem-card.matched { animation: matchPop 0.4s ease; }
@keyframes matchPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.12); }
  100% { transform: scale(1); }
}

// ===== Web Audio 音效与旋律引擎 =====
const NOTE_FREQ = {
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.26, F5:698.46, G5:783.99, A5:880.00, B5:987.77,
  C6:1046.50, D6:1174.66, E6:1318.51, G6:1567.98
};
var audioCtx = null;
var melodyNodes = [];
var melodyTimers = [];
var songStopRequested = false;

function ensureAudio() {
  if (!audioCtx) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// 播放单个音符（音乐盒音色）
function playNote(freq, startTime, dur, vol) {
  var ctx = ensureAudio();
  if (!ctx) return;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  // 两层振荡器增加音乐盒明亮感
  var osc2 = ctx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2;
  var gain2 = ctx.createGain();
  gain2.gain.value = vol * 0.25;
  osc2.connect(gain2);
  gain2.connect(gain);
  osc.connect(gain);
  gain.connect(ctx.destination);
  var t = startTime;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.start(t);
  osc2.start(t);
  osc.stop(t + dur + 0.05);
  osc2.stop(t + dur + 0.05);
  melodyNodes.push(osc, osc2);
}

// 播放一行儿歌旋律，notes 如 "C4 C4 G4 G4 A4 A4 G4:2"
function playLineMelody(notesStr, cb) {
  var ctx = ensureAudio();
  if (!ctx) { if (cb) cb(); return; }
  var notes = notesStr.trim().split(/\s+/);
  var t = ctx.currentTime + 0.08;
  var BEAT = 0.36; // 八分音符时长
  notes.forEach(function(n) {
    var parts = n.split(':');
    var freq = NOTE_FREQ[parts[0]];
    var mult = parseInt(parts[1]) || 1;
    if (!freq) return;
    playNote(freq, t, BEAT * mult * 0.95, 0.16);
    t += BEAT * mult;
  });
  var totalMs = (t - ctx.currentTime - 0.08) * 1000;
  var timer = setTimeout(function() {
    melodyTimers = melodyTimers.filter(function(x) { return x !== timer; });
    if (cb) cb();
  }, totalMs + 60);
  melodyTimers.push(timer);
}

function estimateMelodyMs(notesStr) {
  if (!notesStr) return 0;
  var BEAT = 360;
  var total = 0;
  notesStr.trim().split(/\s+/).forEach(function(n) {
    var parts = n.split(':');
    if (!NOTE_FREQ[parts[0]]) return;
    total += BEAT * (parseInt(parts[1]) || 1);
  });
  return total;
}

function stopMelody() {
  songStopRequested = true;
  melodyTimers.forEach(clearTimeout);
  melodyTimers = [];
  melodyNodes.forEach(function(n) {
    try { n.stop(); } catch (e) {}
    try { n.disconnect(); } catch (e) {}
  });
  melodyNodes = [];
}

// 短促音效（点击/奖励反馈）
function sfxTone(freq, dur, type, vol) {
  var ctx = ensureAudio();
  if (!ctx) return;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  var t = ctx.currentTime;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol || 0.15, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + (dur || 0.12));
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + (dur || 0.12) + 0.05);
}

    for (var i = 0; i < ws.length; i++) {
      if (ws[i].en.toLowerCase() === lower && ws[i].img) return ws[i].img;
    }
  }
  return null;
}

    var ws = TOPICS[key].words;
    for (var i = 0; i < ws.length; i++) {
      if (ws[i].en.toLowerCase() === lower) return ws[i];
    }
  }
  return null;
}

function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}

function getDayOfYear() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  return Math.floor((now - start) / 86400000);
}

function getTodayTopic() {
  const keys = Object.keys(TOPICS);
  return keys[getDayOfYear() % keys.length];
}

function isTodayDone() {
  return state.completedDates.indexOf(getTodayKey()) !== -1;
}

function getTotalWords() {
  let total = 0;
  for (var k in TOPICS) total += TOPICS[k].words.length;
  return total;
}

// ============================================================
//  语音合成（优先选择高质量英语语音）
// ============================================================
var bestEnVoice = null;
var bestZhVoice = null;

function refreshVoices() {
  if (!('speechSynthesis' in window)) return;
  var voices = window.speechSynthesis.getVoices();
  // 英语语音优先级：在线自然语音 > Google > Microsoft > 任意en-US
  var enPref = [
    "Microsoft Aria Online", "Microsoft Jenny Online", "Microsoft Guy Online",
    "Google US English", "Google UK English Female",
    "Samantha", "Alex", "Karen"
  ];
  for (var i = 0; i < enPref.length; i++) {
    for (var j = 0; j < voices.length; j++) {
      if (voices[j].name.indexOf(enPref[i]) !== -1 && voices[j].lang.indexOf("en") !== -1) {
        bestEnVoice = voices[j];
        break;
      }
    }
    if (bestEnVoice) break;
  }
  if (!bestEnVoice) {
    for (var k = 0; k < voices.length; k++) {
      if (voices[k].lang === "en-US") { bestEnVoice = voices[k]; break; }
    }
  }
  // 中文语音
  var zhPref = ["Microsoft Xiaoyi Online", "Microsoft Huihui Online", "Google 普通话", "Tingting"];
  for (var m = 0; m < zhPref.length; m++) {
    for (var n = 0; n < voices.length; n++) {
      if (voices[n].name.indexOf(zhPref[m]) !== -1 && voices[n].lang.indexOf("zh") !== -1) {
        bestZhVoice = voices[n];
        break;
      }
    }
    if (bestZhVoice) break;
  }
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = refreshVoices;
  refreshVoices();
}

function speak(text, opts) {
  opts = opts || {};
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = opts.lang || 'en-US';
  utter.rate = opts.rate || 0.82;
  utter.pitch = opts.pitch || 1.1;
  utter.volume = opts.volume || 1;
  if (opts.lang && opts.lang.indexOf('zh') !== -1) {
    if (bestZhVoice) utter.voice = bestZhVoice;
  } else {
    if (bestEnVoice) utter.voice = bestEnVoice;
  }
  window.speechSynthesis.speak(utter);
  return utter;
}

function speakZh(text) {
  return speak(text, { lang: 'zh-CN', rate: 0.95, pitch: 1.1 });
}

// ===== 跟读评分 =====
function startReadingPractice(targetWord, callback) {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    callback({ supported: false });
    return;
  }
  var rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  var done = false;
  rec.onresult = function(e) {
    if (done) return;
    done = true;
    var alternatives = [];
    for (var i = 0; i < e.results[0].length; i++) {
      alternatives.push(e.results[0][i].transcript.toLowerCase().trim());
    }
    var target = targetWord.toLowerCase().trim().replace(/[^\w\s]/g, '');
    var score = 1; // 保底鼓励分
    var bestMatch = "";
    for (var a = 0; a < alternatives.length; a++) {
      var t = alternatives[a].replace(/[^\w\s]/g, '');
      if (t === target) { score = 3; bestMatch = alternatives[a]; break; }
      if (t.indexOf(target) !== -1 || target.indexOf(t) !== -1) {
        if (score < 2) { score = 2; bestMatch = alternatives[a]; }
      }
      if (t.length > 0 && target.length > 0 && t.charAt(0) === target.charAt(0)) {
        if (score < 2) { score = 2; bestMatch = alternatives[a]; }
      }
    }
    if (!bestMatch && alternatives.length > 0) bestMatch = alternatives[0];
    callback({ supported: true, score: score, transcript: bestMatch });
  };
  rec.onerror = function() {
    if (done) return;
    done = true;
    callback({ supported: true, score: 0, error: true });
  };
  rec.onend = function() {
    if (!done) { done = true; callback({ supported: true, score: 0, error: true }); }
  };
  try { rec.start(); } catch(e) { callback({ supported: false }); }
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

  }
}

var currentRoute = 'home';
var lessonState = null;

function navigate(route) {
  currentRoute = route;
  location.hash = route;
  render();
  updateNav();
  window.scrollTo(0, 0);
}

function updateNav() {
  var items = document.querySelectorAll('.nav-item');
  items.forEach(function(item) {
    var r = item.getAttribute('data-route');
    if (r === currentRoute || (currentRoute === 'word-detail' && r === 'words') || (currentRoute === 'song-detail' && r === 'songs') || ((currentRoute === 'store' || currentRoute === 'parent' || currentRoute === 'phonemes' || currentRoute === 'phoneme-detail') && r === 'home')) {
      item.classList.add('active');
    } else {
      item.classList.remove('active');
    }
  });
}

window.addEventListener('hashchange', function() {
  var hash = location.hash.replace('#', '') || 'home';
  if (hash !== currentRoute) {
    currentRoute = hash;
    render();
    updateNav();
    window.scrollTo(0, 0);
  }
});

  if (h < 14) return "中午好，小朋友";

  return "晚上好，小朋友";
}

function buildCalendar() {
  var now = new Date();
  var year = now.getFullYear();
  var month = now.getMonth();
  var firstDay = new Date(year, month, 1).getDay();
  if (firstDay === 0) firstDay = 7; // Monday=1
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  var html = '<div style="text-align:center;font-weight:700;font-size:14px;color:var(--text-light);margin-bottom:10px">' + year + '年' + monthNames[month] + '</div>';
  html += '<div class="cal-grid">';
  ['一','二','三','四','五','六','日'].forEach(function(d) {
    html += '<div class="cal-dow">' + d + '</div>';
  });
  for (var i = 1; i < firstDay; i++) {
    html += '<div class="cal-empty"></div>';
  }
  for (var d = 1; d <= daysInMonth; d++) {
    var key = year + "-" + (month+1) + "-" + d;
    var done = state.completedDates.indexOf(key) !== -1;
    var isToday = (d === now.getDate());
    html += '<div class="cal-day' + (done ? ' cal-done' : '') + (isToday ? ' cal-today' : '') + '">' + (done ? starSVG(14) : d) + '</div>';
  }
  html += '</div>';
  return html;
}

// ----- 课程 -----
function startLesson() {
  var topicKey = getTodayTopic();
  var topic = TOPICS[topicKey];
  var dayIdx = getDayOfYear();
  // 自然拼读按顺序推进：从已学会的字母之后取2个
  var learnedLetters = state.learnedLetters || [];
  var phIdx = 0;
  while (phIdx < PHONICS.length && learnedLetters.indexOf(PHONICS[phIdx].letter) !== -1) phIdx++;
  var phonics1 = PHONICS[phIdx % PHONICS.length];
  var phonics2 = PHONICS[(phIdx + 1) % PHONICS.length];

  lessonState = {
    topicKey: topicKey,
    topic: topic,
    words: topic.words.slice(0, Math.min(5, topic.words.length)),
    phonics: [phonics1, phonics2],
    step: 0, // 0=warmup, 1=words, 2=phonics, 3=game, 4=reward
    wordIdx: 0,
    phonicsIdx: 0,
    gameRound: 0,
    gameScore: 0,
    gameTotal: 5,
    gameMode: null,
    gameAnswer: null,
    gameAnswered: false,
  };
  navigate('lesson');
}

function renderLesson(app) {
  if (!lessonState) { startLesson(); return; }

  var totalSteps = 4; // warmup, words, phonics, game (reward is end)
  var progress = 0;
  if (lessonState.step === 0) progress = 5;
  else if (lessonState.step === 1) progress = 15 + (lessonState.wordIdx / lessonState.words.length) * 30;
  else if (lessonState.step === 2) progress = 50 + (lessonState.phonicsIdx / lessonState.phonics.length) * 20;
  else if (lessonState.step === 3) progress = 70 + (lessonState.gameRound / lessonState.gameTotal) * 25;
  else progress = 100;

  var stepLabels = ['暖场', '学单词', '学拼读', '玩游戏', '领奖啦'];

  app.innerHTML =
    '<div class="lesson-container">' +
      '<div class="lesson-top-bar">' +
        '<button class="back-btn" id="lessonBack">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>' +
        '</button>' +
        '<div class="lesson-progress-track"><div class="lesson-progress-fill" style="width:' + progress + '%"></div></div>' +
        '<span class="lesson-step-label">' + stepLabels[lessonState.step] + '</span>' +
      '</div>' +
      '<div class="lesson-content" id="lessonContent"></div>' +
    '</div>';

  document.getElementById('lessonBack').addEventListener('click', function() {
    if (confirm('确定要退出今天的学习吗？')) {
      navigate('home');
    }
  });

  if (lessonState.step === 0) renderWarmup();
  else if (lessonState.step === 1) renderWordLearn();
  else if (lessonState.step === 2) renderPhonicsLearn();
  else if (lessonState.step === 3) renderGame();
  else if (lessonState.step === 4) renderReward();
}

          return;
        }
        var stars = '';
        for (var i = 0; i < 3; i++) {
          stars += '<span style="opacity:' + (i < res.score ? 1 : 0.25) + ';display:inline-block;margin:0 2px">' + starSVG(22) + '</span>';
        }
        var msgs = { 1: "不错的尝试！", 2: "很棒！再清楚一点！", 3: "太棒了！发音真标准！" };
        var colors = { 1: "var(--blue)", 2: "var(--primary-dark)", 3: "var(--green)" };
        resultEl.innerHTML = '<div style="margin-bottom:2px">' + stars + '</div><span style="font-size:14px;font-weight:700;color:' + colors[res.score] + '">' + msgs[res.score] + '</span>';
        if (res.score === 3) {
          sfxCorrect();
          speak("Excellent! Perfect pronunciation!", { rate: 0.9, pitch: 1.25 });
          state.stars += 1;
          saveState();
        } else if (res.score === 2) {
          sfxStar();
          speak("Good job! Try once more!", { rate: 0.9, pitch: 1.2 });
        } else {
          speakZh("不错的尝试，再听一次！");
        }
      });
    };
    if (utter && utter.onend !== undefined) {
      utter.onend = function() { setTimeout(doRecord, 350); };
    } else {
      setTimeout(doRecord, 1200);
    }
  });
  document.getElementById('wordNext').addEventListener('click', function() {
    // 标记已学单词
    if (state.learnedWords.indexOf(word.en.toLowerCase()) === -1) {
      state.learnedWords.push(word.en.toLowerCase());
    }
    saveState();
    if (lessonState.wordIdx < total - 1) {
      lessonState.wordIdx++;
      renderLesson(document.getElementById('app'));
    } else {
      lessonState.step = 2;
      lessonState.phonicsIdx = 0;
      renderLesson(document.getElementById('app'));
    }
  });
}

          '<div style="font-size:13px;color:var(--text-light);font-weight:600">看图片，选正确的单词</div>' +
        '</div>' +
      '</div>' +
      '<div class="game-mode-card" id="modeSpell">' +
        '<div class="game-mode-icon" style="background:#E8F5E9">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#43A047" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>' +
        '</div>' +
        '<div>' +
          '<div style="font-family:Fredoka;font-size:20px;font-weight:700;color:var(--text)">拼一拼</div>' +
          '<div style="font-size:13px;color:var(--text-light);font-weight:600">听单词，按顺序点字母</div>' +
        '</div>' +
      '</div>' +
      '<div class="game-mode-card" id="modeMemory">' +
        '<div class="game-mode-icon" style="background:#F3E5F5">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8E24AA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>' +
        '</div>' +
        '<div>' +
          '<div style="font-family:Fredoka;font-size:20px;font-weight:700;color:var(--text)">翻翻乐</div>' +
          '<div style="font-size:13px;color:var(--text-light);font-weight:600">翻卡片，配成对</div>' +
        '</div>' +
      '</div>';

    speak("Let us play a game! Choose a mode.");

    document.getElementById('modeListen').addEventListener('click', function() {
      sfxClick();
      lessonState.gameMode = 'listen';
      lessonState.gameRound = 0;
      lessonState.gameTotal = 5;
      renderLesson(document.getElementById('app'));
    });
    document.getElementById('modeLook').addEventListener('click', function() {
      sfxClick();
      lessonState.gameMode = 'look';
      lessonState.gameRound = 0;
      lessonState.gameTotal = 5;
      renderLesson(document.getElementById('app'));
    });
    document.getElementById('modeSpell').addEventListener('click', function() {
      sfxClick();
      lessonState.gameMode = 'spell';
      lessonState.gameRound = 0;
      lessonState.gameTotal = 5;
      renderLesson(document.getElementById('app'));
    });
    document.getElementById('modeMemory').addEventListener('click', function() {
      sfxClick();
      lessonState.gameMode = 'memory';
      lessonState.gameRound = 0;
      lessonState.gameTotal = 3;
      renderLesson(document.getElementById('app'));
    });
    return;
  }

  // 选一个正确答案
  var correctWord = lessonState.words[lessonState.gameRound % lessonState.words.length];
  // 选3个干扰项
  var allWords = lessonState.topic.words.filter(function(w) { return w.en !== correctWord.en; });
  var distractors = shuffle(allWords).slice(0, 3);
  var options = shuffle([correctWord].concat(distractors));

  lessonState.gameAnswer = correctWord.en;
  lessonState.gameAnswered = false;

  var isLookMode = lessonState.gameMode === 'look';

  // ===== 拼一拼（听单词，按顺序点字母）=====
  if (lessonState.gameMode === 'spell') {
    // 只选纯字母单词（排除 How are you? 这类短语）
    var spellPool = lessonState.words.filter(function(w) { return /^[a-zA-Z]+$/.test(w.en); });
    if (!spellPool.length) spellPool = lessonState.words;
    var spWord = spellPool[lessonState.gameRound % spellPool.length];
    var wordLetters = spWord.en.toLowerCase().split('');
    // 生成洗牌后的字母（去掉重复问题：直接打乱）
    var shuffledLetters = shuffle(wordLetters.slice());
    // 若打乱后与原顺序完全一致则再打一次
    if (shuffledLetters.join('') === wordLetters.join('')) shuffledLetters = shuffle(wordLetters.slice());

    c.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
        renderLeo('cheer', 44) +
        '<span style="font-size:15px;font-weight:700;color:var(--text-light)">听一听，拼一拼：</span>' +
      '</div>' +
      '<div class="game-round-info">第 ' + (lessonState.gameRound + 1) + ' / ' + lessonState.gameTotal + ' 题</div>' +
      '<button class="game-listen-btn" id="gameListen">' + speakerSVG(36) + '</button>' +
      '<div class="spell-built" id="spellBuilt"></div>' +
      '<div class="spell-letters" id="spellLetters">' +
        shuffledLetters.map(function(l, i) { return '<div class="spell-tile" data-idx="' + i + '">' + l + '</div>'; }).join('') +
      '</div>' +
      '<div id="spellFeedback" style="min-height:30px;text-align:center;margin-top:8px"></div>' +
      '<div class="game-score-stars">' + Array(lessonState.gameRound).fill('<span style="font-size:24px">' + starSVG(24) + '</span>').join('') + '</div>';

    var builtWord = '';
    var usedIdx = [];

    function updateBuilt() {
      var el = document.getElementById('spellBuilt');
      el.innerHTML = builtWord.split('').map(function(l) {
        return '<span class="spell-built-char">' + l + '</span>';
      }).join('');
    }

    setTimeout(function() { speak(spWord.en, { rate: 0.68 }); }, 400);
    document.getElementById('gameListen').addEventListener('click', function() {
      speak(spWord.en, { rate: 0.68 });
    });

    var spellTiles = document.querySelectorAll('.spell-tile');
    spellTiles.forEach(function(tile) {
      tile.addEventListener('click', function() {
        if (lessonState.gameAnswered) return;
        var idx = parseInt(tile.getAttribute('data-idx'));
        if (usedIdx.indexOf(idx) !== -1) return;
        var expected = wordLetters[builtWord.length];
        if (tile.textContent === expected) {
          // 正确：字母固定到拼写区
          sfxTone(NOTE_FREQ['C5'] || 523.25, 0.12, 'triangle', 0.12);
          usedIdx.push(idx);
          builtWord += expected;
          tile.classList.add('used');
          updateBuilt();
          if (builtWord.length === wordLetters.length) {
            // 拼完
            lessonState.gameAnswered = true;
            lessonState.gameScore++;
            state.gameCorrect = (state.gameCorrect || 0) + 1;
            saveState();
            sfxCorrect();
            var img = spWord.img ? '<img src="' + spWord.img + '" style="width:110px;height:110px;object-fit:contain;border-radius:18px;background:var(--bg-soft);padding:8px;box-shadow:var(--shadow)">' : '';
            document.getElementById('spellFeedback').innerHTML =
              '<div style="display:flex;flex-direction:column;align-items:center;gap:8px">' + img +
              '<span style="font-size:16px;font-weight:700;color:var(--green)">' + spWord.en + '，拼对啦！</span></div>';
            speak(randomItem(PRAISE_CORRECT), { rate: 0.9, pitch: 1.25 });
            setTimeout(function() {
              lessonState.gameRound++;
              renderLesson(document.getElementById('app'));
            }, 2000);
          }
        } else {
          // 错误：字母抖动 + 温柔提示
          tile.classList.add('spell-wrong');
          sfxWrong();
          setTimeout(function() { tile.classList.remove('spell-wrong'); }, 500);
        }
      });
    });

    return;
  }

  // ===== 翻翻乐（记忆配对）=====
  if (lessonState.gameMode === 'memory') {
    // 抽 3 对：单词卡（英文）+ 图片卡（只选有配图的单词）
    var pool = lessonState.topic.words.filter(function(w) { return w.img; });
    var pairWords = shuffle(pool).slice(0, 3);
    var memCards = [];
    pairWords.forEach(function(w) {
      memCards.push({ type: 'word', word: w.en, img: null });
      memCards.push({ type: 'pic', word: w.en, img: w.img });
    });
    memCards = shuffle(memCards);

    c.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
        renderLeo('think', 44) +
        '<span style="font-size:15px;font-weight:700;color:var(--text-light)">翻一翻，找朋友：</span>' +
      '</div>' +
      '<div class="game-round-info">第 ' + (lessonState.gameRound + 1) + ' / ' + lessonState.gameTotal + ' 局</div>' +
      '<div class="mem-grid">' +
        memCards.map(function(card, i) {
          return '<div class="mem-card" data-idx="' + i + '">' +
            '<div class="mem-inner">' +
              '<div class="mem-front">' +
                '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z"/></svg>' +
              '</div>' +
              '<div class="mem-back">' +
                (card.type === 'word'
                  ? '<span style="font-family:Fredoka;font-size:22px;font-weight:700;color:var(--primary-dark)">' + card.word + '</span>'
                  : (card.img ? '<img src="' + card.img + '" alt="' + card.word + '" style="width:100%;height:100%;object-fit:contain;border-radius:12px;background:var(--bg-soft);padding:6px">' : card.word)) +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>' +
      '<div id="memFeedback" style="min-height:30px;text-align:center;margin-top:8px"></div>' +
      '<div class="game-score-stars">' + Array(lessonState.gameRound).fill('<span style="font-size:24px">' + starSVG(24) + '</span>').join('') + '</div>';

    var openCards = [];
    var matchedCount = 0;
    var lockBoard = false;
    var fb = document.getElementById('memFeedback');

    function flipBack(cardEl) {
      cardEl.classList.remove('flipped');
    }

    var memEls = document.querySelectorAll('.mem-card');
    memEls.forEach(function(cardEl) {
      cardEl.addEventListener('click', function() {
        if (lockBoard) return;
        if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
        sfxClick();
        cardEl.classList.add('flipped');
        var idx = parseInt(cardEl.getAttribute('data-idx'));
        openCards.push({ el: cardEl, card: memCards[idx] });
        if (openCards.length === 2) {
          lockBoard = true;
          var first = openCards[0], second = openCards[1];
          if (first.card.word === second.card.word && first.card.type !== second.card.type) {
            // 配对成功
            matchedCount++;
            first.el.classList.add('matched');
            second.el.classList.add('matched');
            sfxCorrect();
            fb.innerHTML = '<span style="font-size:15px;font-weight:700;color:var(--green)">配对成功！</span>';
            openCards = [];
            lockBoard = false;
            if (matchedCount === pairWords.length) {
              // 本局完成
              lessonState.gameAnswered = true;
              lessonState.gameScore += 3;
              state.gameCorrect = (state.gameCorrect || 0) + 3;
              saveState();
              fb.innerHTML = '<span style="font-size:16px;font-weight:700;color:var(--green)">全部配对了！太棒了！</span>';
              speak(randomItem(PRAISE_CORRECT), { rate: 0.9, pitch: 1.25 });
              setTimeout(function() {
                lessonState.gameRound++;
                renderLesson(document.getElementById('app'));
              }, 2000);
            }
          } else {
            // 不匹配
            fb.innerHTML = '<span style="font-size:15px;font-weight:700;color:var(--blue)">再试一次！</span>';
            sfxWrong();
            setTimeout(function() {
              first.el.classList.remove('flipped');
              second.el.classList.remove('flipped');
              openCards = [];
              lockBoard = false;
              fb.innerHTML = '';
            }, 900);
          }
        }
      });
    });

    return;
  }

  var optionsHtml = options.map(function(opt) {
    if (isLookMode) {
      return '<div class="game-option game-option-textonly" data-answer="' + opt.en + '"><div class="game-option-text" style="font-size:22px">' + opt.en + '</div></div>';
    }

    else if (opt.color) visual = '<div class="game-option-color" style="background:' + opt.color + '"></div>';
    else if (opt.num) visual = '<div style="font-size:36px;font-weight:700;font-family:Fredoka;color:var(--purple)">' + opt.num + '</div>';
    return '<div class="game-option" data-answer="' + opt.en + '">' + visual + '<div class="game-option-text">' + opt.en + '</div></div>';
  }).join('');

  var starsHtml = Array(lessonState.gameRound).fill('<span style="font-size:24px">' + starSVG(24) + '</span>').join('');

  if (isLookMode) {
    c.innerHTML =
      '<div class="game-round-info">第 ' + (lessonState.gameRound + 1) + ' / ' + lessonState.gameTotal + ' 题</div>' +
      '<div style="text-align:center;margin:8px 0">' +
        '<img src="' + (correctWord.img || '') + '" style="width:130px;height:130px;object-fit:contain;border-radius:20px;background:var(--bg-soft);padding:10px;box-shadow:var(--shadow)">' +
      '</div>' +
      '<div class="game-instruction">这是什么？</div>' +
      '<div class="game-options">' + optionsHtml + '</div>' +
      '<div class="game-score-stars" id="gameStars">' + starsHtml + '</div>';
  } else {
    c.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
        renderLeo('happy', 44) +
        '<span style="font-size:15px;font-weight:700;color:var(--text-light)">' + (lessonState.gameRound === 0 ? '仔细听哦：' : '继续加油：') + '</span>' +
      '</div>' +
      '<div class="game-round-info">第 ' + (lessonState.gameRound + 1) + ' / ' + lessonState.gameTotal + ' 题</div>' +
      '<div class="game-instruction">听一听，点一点</div>' +
      '<button class="game-listen-btn" id="gameListen">' + speakerSVG(36) + '</button>' +
      '<div class="game-options">' + optionsHtml + '</div>' +
      '<div class="game-score-stars" id="gameStars">' + starsHtml + '</div>';

    setTimeout(function() { speak(correctWord.en, { rate: 0.8 }); }, 400);
  }

  var listenBtn = document.getElementById('gameListen');
  if (listenBtn) {
    listenBtn.addEventListener('click', function() {
      speak(correctWord.en, { rate: 0.8 });
    });
  }

  var optEls = document.querySelectorAll('.game-option');
  optEls.forEach(function(el) {
    el.addEventListener('click', function() {
      if (lessonState.gameAnswered) return;
      lessonState.gameAnswered = true;
      var answer = el.getAttribute('data-answer');
      if (answer === lessonState.gameAnswer) {
        el.classList.add('correct');
        lessonState.gameScore++;
        state.gameCorrect = (state.gameCorrect || 0) + 1;
        saveState();
        sfxCorrect();
        // 地道英语表扬，营造沉浸式语境
        speak(randomItem(PRAISE_CORRECT), { rate: 0.9, pitch: 1.25 });
        setTimeout(function() {
          lessonState.gameRound++;
          renderLesson(document.getElementById('app'));
        }, 1800);
      } else {
        el.classList.add('wrong');
        sfxWrong();
        // 温柔引导，绝不批评
        var tryMsg = randomItem(PRAISE_TRYAGAIN);
        if (tryMsg.match(/[a-zA-Z]/)) {
          speak(tryMsg, { rate: 0.85, pitch: 1.2 });
        } else {
          speakZh(tryMsg);
        }
        lessonState.gameAnswered = false;
        setTimeout(function() { el.classList.remove('wrong'); }, 800);
      }
    });
  });
}

function finishGame() {
  // 计算星星 (至少1颗，满分3颗)
  var ratio = lessonState.gameScore / lessonState.gameTotal;
  var starsEarned = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : 1;

  state.stars += starsEarned;
  state.totalLessons++;

  // 更新连续天数
  var today = getTodayKey();
  if (state.lastPlayDate !== today) {
    var yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    var yKey = yesterday.getFullYear() + "-" + (yesterday.getMonth()+1) + "-" + yesterday.getDate();
    if (state.lastPlayDate === yKey) {
      state.streak++;
    } else {
      state.streak = 1;
    }
    state.lastPlayDate = today;
    if (state.streak > state.longestStreak) state.longestStreak = state.streak;
  }
  if (state.completedDates.indexOf(today) === -1) {
    state.completedDates.push(today);
  }

  // 日学习数据
  state.weeklyData[today] = (state.weeklyData[today] || 0) + 1;

  saveState();
  lessonState.step = 4;
  lessonState.starsEarned = starsEarned;
  renderLesson(document.getElementById('app'));
}

function getWeekKey() {
  var d = new Date();
  var day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}

  });

function playSingleLine(idx) {
  if (!currentSong) return;
  songStopRequested = true; // 终止整首递归
  stopMelody();
  window.speechSynthesis && window.speechSynthesis.cancel();
  clearSongHighlights();
  songPlayingLine = idx;
  var el = document.getElementById('songLine' + idx);
  if (el) el.classList.add('active');
  var line = currentSong.lines[idx];
  var melody = currentSong.melody ? currentSong.melody[idx] : null;
  if (melody) {
    playLineMelody(melody, function() {});
    speak(line, { rate: 0.62, pitch: 1.08 });
  } else {
    speak(line, { rate: 0.7, pitch: 1.1 });
  }
}

function playSongLines(startIdx) {
  if (!currentSong || startIdx >= currentSong.lines.length) {
    clearSongHighlights();
    return;
  }
  if (songStopRequested) return;
  clearSongHighlights();
  songPlayingLine = startIdx;
  var el = document.getElementById('songLine' + startIdx);
  if (el) el.classList.add('active');
  var line = currentSong.lines[startIdx];
  var melody = currentSong.melody ? currentSong.melody[startIdx] : null;

  var pending = 0;
  var finished = false;
  function fin() {
    if (finished) return;
    pending--;
    if (pending <= 0) {
      finished = true;
      if (!songStopRequested) {
        setTimeout(function() { playSongLines(startIdx + 1); }, 650);
      }
    }
  }
  if (melody) {
    pending++;
    playLineMelody(melody, fin);
  }
  pending++;
  var utter = speak(line, { rate: 0.62, pitch: 1.08 });
  if (utter && utter.onend !== undefined) {
    utter.onend = fin;
  } else {
    setTimeout(fin, estimateMelodyMs(melody) + 800);
  }
  // 兜底：无论 TTS 是否触发回调，都确保推进
  setTimeout(fin, estimateMelodyMs(melody) + 3500);
}

function clearSongHighlights() {
  var els = document.querySelectorAll('.song-line.active');
  els.forEach(function(el) { el.classList.remove('active'); });
}

      pressTimer = setInterval(function() {
        var elapsed = Date.now() - pressStart;
        var pct = Math.min(100, (elapsed / 2000) * 100);
        progress.style.width = pct + '%';
        if (elapsed >= 2000) {
          clearInterval(pressTimer);
          parentUnlocked = true;
          renderParent(document.getElementById('app'));
        }
      }, 50);
    }
    function endPress() {
      clearInterval(pressTimer);
      progress.style.width = '0%';
    }
    btn.addEventListener('mousedown', startPress);
    btn.addEventListener('touchstart', function(e) { e.preventDefault(); startPress(); });
    btn.addEventListener('mouseup', endPress);
    btn.addEventListener('mouseleave', endPress);
    btn.addEventListener('touchend', endPress);
    return;
  }

  // 已解锁
  var weekDays = getWeekDays();
  var barsHtml = weekDays.map(function(d) {
    var count = state.weeklyData[d.key] || 0;
    var height = count > 0 ? Math.max(8, (count / 3) * 100) : 4;
    return '<div class="weekly-bar-col">' +
      '<div class="weekly-bar" style="height:' + height + '%"></div>' +
      '<div class="weekly-bar-label">' + d.label + '</div>' +
    '</div>';
  }).join('');

  app.innerHTML =
    '<div class="page-header">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
        '<button class="back-btn" id="parentBack">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="page-title">家长专区</div>' +
      '<div class="page-sub">查看孩子的学习进度</div>' +
    '</div>' +
    '<div class="parent-stats-grid">' +
      '<div class="parent-stat"><div class="parent-stat-num" style="color:var(--primary-dark)">' + state.stars + '</div><div class="parent-stat-label">总星星数</div></div>' +
      '<div class="parent-stat"><div class="parent-stat-num" style="color:var(--orange)">' + state.streak + '</div><div class="parent-stat-label">当前连续天数</div></div>' +
      '<div class="parent-stat"><div class="parent-stat-num" style="color:var(--secondary)">' + state.learnedWords.length + '</div><div class="parent-stat-label">已学单词</div></div>' +
      '<div class="parent-stat"><div class="parent-stat-num" style="color:var(--purple)">' + state.totalLessons + '</div><div class="parent-stat-label">完成课程</div></div>' +
    '</div>' +
    '<div class="weekly-chart">' +
      '<div class="weekly-chart-title">本周学习情况</div>' +
      '<div class="weekly-bars">' + barsHtml + '</div>' +
    '</div>' +
    '<div class="parent-actions">' +
      '<button class="parent-action-btn" id="resetProgress">' +
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>' +
        '重置学习进度' +
      '</button>' +
      '<div style="text-align:center;padding:12px;font-size:12px;color:var(--text-light)">Leo 英语小乐园 v1.0</div>' +
    '</div>';

  document.getElementById('parentBack').addEventListener('click', function() { navigate('home'); });
  document.getElementById('resetProgress').addEventListener('click', function() {
    if (confirm('确定要重置所有学习进度吗？此操作不可恢复。')) {
      state = {
        stars: 0, streak: 0, longestStreak: 0, lastPlayDate: null,
        completedDates: [], learnedWords: [], learnedLetters: [],
        totalLessons: 0, weeklyData: {}, gameCorrect: 0, songsPlayed: [],
        ownedGears: [], activeGear: null, learnedPhonemes: [],
      };
      saveState();
      alert('进度已重置');
      renderParent(document.getElementById('app'));
    }
  });
}

function getWeekDays() {
  var labels = ['一', '二', '三', '四', '五', '六', '日'];
  var days = [];
  var now = new Date();
  var day = now.getDay() || 7;
  var monday = new Date(now);
  monday.setDate(now.getDate() - day + 1);
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push({
      label: labels[i],
      key: d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate()
    });
  }
  return days;
}

loadState();

// 底部导航
document.querySelectorAll('.nav-item').forEach(function(item) {
  item.addEventListener('click', function() {
    var route = item.getAttribute('data-route');
    if (route === 'parent') parentUnlocked = false;
    navigate(route);
  });
});

// 初始路由
var initHash = location.hash.replace('#', '') || 'home';
currentRoute = initHash;
render();
updateNav();

// 注册 Service Worker（PWA 离线支持，仅在 http/https 下生效）
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  });
}

// ===== 启动欢迎页：点击解锁声音 =====
var soundUnlocked = false;
function unlockSound() {
  if (soundUnlocked) return;
  soundUnlocked = true;
  ensureAudio();
  // 播放一个无声音解锁音频上下文
  try {
    var ctx = ensureAudio();
    if (ctx) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.frequency.value = 1;
      gain.gain.value = 0;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.01);
    }
  } catch(e) {}
}

document.getElementById('splashStart').addEventListener('click', function() {
  unlockSound();
  var splash = document.getElementById('splash-screen');
  splash.classList.add('hidden');
  setTimeout(function() { splash.style.display = 'none'; }, 500);
  // 欢迎语音
  setTimeout(function() {
    var hour = new Date().getHours();
    var greet = hour < 12 ? '早上好' : hour < 18 ? '下午好' : '晚上好';
    speakZh(greet + '，小朋友！我是 Leo，今天也要开心学英语哦！');
  }, 300);
});

// ===== PWA 安装应用 =====
var deferredPrompt = null;
var isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  // 如果在首页，刷新显示安装按钮
  if (currentRoute === 'home') render();
});

window.addEventListener('appinstalled', function() {
  deferredPrompt = null;
  if (currentRoute === 'home') render();
});

function canInstallApp() {
  return deferredPrompt !== null && !isStandalone;
}

function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function() {
    deferredPrompt = null;
    if (currentRoute === 'home') render();
  });
}
</script>
