function startLesson() {
  // 先检查是否有需要复习的单词（艾宾浩斯）
  var reviewWords = getReviewWords();
  if (reviewWords.length > 0) {
    startReview();
    return;
  }
  var topicKey = getTodayTopic();
  var topic = TOPICS[topicKey];
  var dayIdx = getDayOfYear();
  // 自然拼读按顺序推进：从已学会的字母之后取2个
  var learnedLetters = state.learnedLetters || [];
  var phIdx = 0;
  while (phIdx < PHONICS.length && learnedLetters.indexOf(PHONICS[phIdx].letter) !== -1) phIdx++;
  var phonics1 = PHONICS[phIdx % PHONICS.length];
  var phonics2 = PHONICS[(phIdx + 1) % PHONICS.length];

  lessonState = {
    topicKey: topicKey,
    topic: topic,
    words: topic.words.slice(0, Math.min(5, topic.words.length)),
    phonics: [phonics1, phonics2],
    step: 0, // 0=warmup, 1=words, 2=phonics, 3=game, 4=reward
    wordIdx: 0,
    phonicsIdx: 0,
    gameRound: 0,
    gameScore: 0,
    gameTotal: 5,
    gameMode: null,
    gameAnswer: null,
    gameAnswered: false,
  };
  navigate('lesson');
}

// ===== 复习页面（艾宾浩斯）=====
var reviewState = { words: [], idx: 0, correct: 0, wrong: 0 };

function startReview() {
  var words = getReviewWords();
  if (words.length === 0) return false;
  reviewState = { words: shuffleArray(words.slice()), idx: 0, correct: 0, wrong: 0 };
  navigate('review');
  return true;
}

function renderReview(app) {
  if (reviewState.words.length === 0) {
    navigate('home');
    return;
  }

  var total = reviewState.words.length;
  var idx = reviewState.idx;

  // 复习完成
  if (idx >= total) {
    var pct = total > 0 ? Math.round(reviewState.correct / total * 100) : 0;
    app.innerHTML =
      '<div class="page-header">' +
        '<div class="page-title">复习完成！</div>' +
        '<div class="page-sub">今天复习了 ' + total + ' 个单词</div>' +
      '</div>' +
      '<div style="text-align:center;padding:30px 20px">' +
        '<div style="font-size:72px;margin-bottom:12px">🌟</div>' +
        '<div style="font-size:22px;font-weight:700;color:var(--green);margin-bottom:8px">答对 ' + reviewState.correct + ' / ' + total + '</div>' +
        '<div style="font-size:15px;color:var(--text-light);margin-bottom:24px">正确率 ' + pct + '%</div>' +
        '<button class="btn btn-green" id="reviewDone" style="width:100%;max-width:280px;font-size:17px;padding:14px">开始今天的学习 →</button>' +
      '</div>';
    document.getElementById('reviewDone').addEventListener('click', function() {
      sfxClick();
      startLesson();
    });
    speakZh('复习完成啦，太棒了！', { rate: 0.95 });
    return;
  }

  var wordEn = reviewState.words[idx];
  var wordObj = findWord(wordEn);
  var progress = Math.round((idx / total) * 100);

  // 生成4个选项（1个正确 + 3个干扰）
  var allWords = [];
  for (var k in TOPICS) { TOPICS[k].words.forEach(function(w) { allWords.push(w); }); }
  var options = [wordObj];
  while (options.length < 4) {
    var r = allWords[Math.floor(Math.random() * allWords.length)];
    if (options.indexOf(r) === -1) options.push(r);
  }
  options = shuffleArray(options);

  var backSvg = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';

  app.innerHTML =
    '<div class="page-header">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
        '<button class="back-btn" id="reviewBack">' + backSvg + '</button>' +
      '</div>' +
      '<div class="page-title">复习时间</div>' +
      '<div class="page-sub">听一听，选一选</div>' +
      '<div class="phonics-progress">' +
        '<div class="phonics-progress-bar"><div class="phonics-progress-fill" style="width:' + progress + '%"></div></div>' +
        '<div class="phonics-progress-text">第 ' + (idx + 1) + ' / ' + total + ' 个</div>' +
      '</div>' +
    '</div>' +
    '<div style="text-align:center;padding:16px 20px 8px">' +
      '<button class="speak-btn" id="reviewPlay" style="width:72px;height:72px;font-size:28px">' + speakerSVG(32) + '</button>' +
      '<div style="font-size:14px;color:var(--text-light);margin-top:8px;font-weight:600">点喇叭再听一遍</div>' +
    '</div>' +
    '<div class="game-grid" id="reviewOptions">' +
      options.map(function(w, i) {
        var img = findWordImg(w.en);
        return '<div class="game-card" data-word="' + w.en + '" data-idx="' + i + '">' +
          (img ? '<img src="' + img + '" class="game-card-img" alt="' + w.en + '">' : '<div class="game-card-img" style="display:flex;align-items:center;justify-content:center;font-size:40px">' + (w.emoji || '🔤') + '</div>') +
          '<div class="game-card-word">' + w.en + '</div>' +
        '</div>';
      }).join('') +
    '</div>';

  document.getElementById('reviewBack').addEventListener('click', function() { navigate('home'); });

  var playSound = function() {
    if (wordObj) speakWord(wordObj);
    else speak(wordEn);
  };
  document.getElementById('reviewPlay').addEventListener('click', function() { sfxClick(); playSound(); });

  // 自动播放
  setTimeout(playSound, 400);

  app.querySelectorAll('.game-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var chosen = card.getAttribute('data-word');
      var isCorrect = chosen === wordEn;
      if (isCorrect) {
        sfxCorrect();
        reviewState.correct++;
        markWordReviewed(wordEn, true);
        card.classList.add('correct');
        card.innerHTML += '<div class="game-card-check">' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>';
      } else {
        sfxWrong();
        reviewState.wrong++;
        markWordReviewed(wordEn, false);
        card.classList.add('wrong');
        // 高亮正确答案
        app.querySelectorAll('.game-card').forEach(function(c) {
          if (c.getAttribute('data-word') === wordEn) c.classList.add('correct');
        });
      }
      setTimeout(function() {
        reviewState.idx++;
        renderReview(app);
      }, isCorrect ? 900 : 1500);
    });
  });
}

function renderLesson(app) {
  if (!lessonState) { startLesson(); return; }

  var totalSteps = 4; // warmup, words, phonics, game (reward is end)
  var progress = 0;
  if (lessonState.step === 0) progress = 5;
  else if (lessonState.step === 1) progress = 15 + (lessonState.wordIdx / lessonState.words.length) * 30;
  else if (lessonState.step === 2) progress = 50 + (lessonState.phonicsIdx / lessonState.phonics.length) * 20;
  else if (lessonState.step === 3) progress = 70 + (lessonState.gameRound / lessonState.gameTotal) * 25;
  else progress = 100;

  var stepLabels = ['暖场', '学单词', '学拼读', '玩游戏', '领奖啦'];

  app.innerHTML =
    '<div class="lesson-container">' +
      '<div class="lesson-top-bar">' +
        '<button class="back-btn" id="lessonBack">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>' +
        '</button>' +
        '<div class="lesson-progress-track"><div class="lesson-progress-fill" style="width:' + progress + '%"></div></div>' +
        '<span class="lesson-step-label">' + stepLabels[lessonState.step] + '</span>' +
      '</div>' +
      '<div class="lesson-content" id="lessonContent"></div>' +
    '</div>';

  document.getElementById('lessonBack').addEventListener('click', function() {
    if (confirm('确定要退出今天的学习吗？')) {
      navigate('home');
    }
  });

  if (lessonState.step === 0) renderWarmup();
  else if (lessonState.step === 1) renderWordLearn();
  else if (lessonState.step === 2) renderPhonicsLearn();
  else if (lessonState.step === 3) renderGame();
  else if (lessonState.step === 4) renderReward();
}

function renderGame() {
  var c = document.getElementById('lessonContent');
  if (lessonState.gameRound >= lessonState.gameTotal) {
    finishGame();
    return;
  }

  // 游戏模式选择
  if (!lessonState.gameMode) {
    c.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
        renderLeo('excited', 44) +
        '<span style="font-size:15px;font-weight:700;color:var(--text-light)">选一个玩法：</span>' +
      '</div>' +
      '<div class="game-mode-card" id="modeListen">' +
        '<div class="game-mode-icon" style="background:#E3F2FD">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5B9DFB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>' +
        '</div>' +
        '<div>' +
          '<div style="font-family:Fredoka;font-size:20px;font-weight:700;color:var(--text)">听音选图</div>' +
          '<div style="font-size:13px;color:var(--text-light);font-weight:600">听单词，点正确的图片</div>' +
        '</div>' +
      '</div>' +
      '<div class="game-mode-card" id="modeLook">' +
        '<div class="game-mode-icon" style="background:#FFF3E0">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFB800" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>' +
        '</div>' +
        '<div>' +
          '<div style="font-family:Fredoka;font-size:20px;font-weight:700;color:var(--text)">看图选词</div>' +
          '<div style="font-size:13px;color:var(--text-light);font-weight:600">看图片，选正确的单词</div>' +
        '</div>' +
      '</div>' +
      '<div class="game-mode-card" id="modeSpell">' +
        '<div class="game-mode-icon" style="background:#E8F5E9">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#43A047" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>' +
        '</div>' +
        '<div>' +
          '<div style="font-family:Fredoka;font-size:20px;font-weight:700;color:var(--text)">拼一拼</div>' +
          '<div style="font-size:13px;color:var(--text-light);font-weight:600">听单词，按顺序点字母</div>' +
        '</div>' +
      '</div>' +
      '<div class="game-mode-card" id="modeMemory">' +
        '<div class="game-mode-icon" style="background:#F3E5F5">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8E24AA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>' +
        '</div>' +
        '<div>' +
          '<div style="font-family:Fredoka;font-size:20px;font-weight:700;color:var(--text)">翻翻乐</div>' +
          '<div style="font-size:13px;color:var(--text-light);font-weight:600">翻卡片，配成对</div>' +
        '</div>' +
      '</div>';

    speak("Let us play a game! Choose a mode.");

    document.getElementById('modeListen').addEventListener('click', function() {
      sfxClick();
      lessonState.gameMode = 'listen';
      lessonState.gameRound = 0;
      lessonState.gameTotal = 5;
      renderLesson(document.getElementById('app'));
    });
    document.getElementById('modeLook').addEventListener('click', function() {
      sfxClick();
      lessonState.gameMode = 'look';
      lessonState.gameRound = 0;
      lessonState.gameTotal = 5;
      renderLesson(document.getElementById('app'));
    });
    document.getElementById('modeSpell').addEventListener('click', function() {
      sfxClick();
      lessonState.gameMode = 'spell';
      lessonState.gameRound = 0;
      lessonState.gameTotal = 5;
      renderLesson(document.getElementById('app'));
    });
    document.getElementById('modeMemory').addEventListener('click', function() {
      sfxClick();
      lessonState.gameMode = 'memory';
      lessonState.gameRound = 0;
      lessonState.gameTotal = 3;
      renderLesson(document.getElementById('app'));
    });
    return;
  }

  // 选一个正确答案
  var correctWord = lessonState.words[lessonState.gameRound % lessonState.words.length];
  // 选3个干扰项
  var allWords = lessonState.topic.words.filter(function(w) { return w.en !== correctWord.en; });
  var distractors = shuffle(allWords).slice(0, 3);
  var options = shuffle([correctWord].concat(distractors));

  lessonState.gameAnswer = correctWord.en;
  lessonState.gameAnswered = false;

  var isLookMode = lessonState.gameMode === 'look';

  // ===== 拼一拼（听单词，按顺序点字母）=====
  if (lessonState.gameMode === 'spell') {
    // 只选纯字母单词（排除 How are you? 这类短语）
    var spellPool = lessonState.words.filter(function(w) { return /^[a-zA-Z]+$/.test(w.en); });
    if (!spellPool.length) spellPool = lessonState.words;
    var spWord = spellPool[lessonState.gameRound % spellPool.length];
    var wordLetters = spWord.en.toLowerCase().split('');
    // 生成洗牌后的字母（去掉重复问题：直接打乱）
    var shuffledLetters = shuffle(wordLetters.slice());
    // 若打乱后与原顺序完全一致则再打一次
    if (shuffledLetters.join('') === wordLetters.join('')) shuffledLetters = shuffle(wordLetters.slice());

    c.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
        renderLeo('cheer', 44) +
        '<span style="font-size:15px;font-weight:700;color:var(--text-light)">听一听，拼一拼：</span>' +
      '</div>' +
      '<div class="game-round-info">第 ' + (lessonState.gameRound + 1) + ' / ' + lessonState.gameTotal + ' 题</div>' +
      '<button class="game-listen-btn" id="gameListen">' + speakerSVG(36) + '</button>' +
      '<div class="spell-built" id="spellBuilt"></div>' +
      '<div class="spell-letters" id="spellLetters">' +
        shuffledLetters.map(function(l, i) { return '<div class="spell-tile" data-idx="' + i + '">' + l + '</div>'; }).join('') +
      '</div>' +
      '<div id="spellFeedback" style="min-height:30px;text-align:center;margin-top:8px"></div>' +
      '<div class="game-score-stars">' + Array(lessonState.gameRound).fill('<span style="font-size:24px">' + starSVG(24) + '</span>').join('') + '</div>';

    var builtWord = '';
    var usedIdx = [];

    function updateBuilt() {
      var el = document.getElementById('spellBuilt');
      el.innerHTML = builtWord.split('').map(function(l) {
        return '<span class="spell-built-char">' + l + '</span>';
      }).join('');
    }

    setTimeout(function() { speakWord(spWord, { rate: 0.68 }); }, 400);
    document.getElementById('gameListen').addEventListener('click', function() {
      speakWord(spWord, { rate: 0.68 });
    });

    var spellTiles = document.querySelectorAll('.spell-tile');
    spellTiles.forEach(function(tile) {
      tile.addEventListener('click', function() {
        if (lessonState.gameAnswered) return;
        var idx = parseInt(tile.getAttribute('data-idx'));
        if (usedIdx.indexOf(idx) !== -1) return;
        var expected = wordLetters[builtWord.length];
        if (tile.textContent === expected) {
          // 正确：字母固定到拼写区
          sfxTone(NOTE_FREQ['C5'] || 523.25, 0.12, 'triangle', 0.12);
          usedIdx.push(idx);
          builtWord += expected;
          tile.classList.add('used');
          updateBuilt();
          if (builtWord.length === wordLetters.length) {
            // 拼完
            lessonState.gameAnswered = true;
            lessonState.gameScore++;
            state.gameCorrect = (state.gameCorrect || 0) + 1;
            saveState();
            sfxCorrect();
            var img = spWord.img ? '<img src="' + spWord.img + '" style="width:110px;height:110px;object-fit:contain;border-radius:18px;background:var(--bg-soft);padding:8px;box-shadow:var(--shadow)">' : '';
            document.getElementById('spellFeedback').innerHTML =
              '<div style="display:flex;flex-direction:column;align-items:center;gap:8px">' + img +
              '<span style="font-size:16px;font-weight:700;color:var(--green)">' + spWord.en + '，拼对啦！</span></div>';
            speak(randomItem(PRAISE_CORRECT), { rate: 0.9, pitch: 1.25 });
            setTimeout(function() {
              lessonState.gameRound++;
              renderLesson(document.getElementById('app'));
            }, 2000);
          }
        } else {
          // 错误：字母抖动 + 温柔提示
          tile.classList.add('spell-wrong');
          sfxWrong();
          setTimeout(function() { tile.classList.remove('spell-wrong'); }, 500);
        }
      });
    });

    return;
  }

  // ===== 翻翻乐（记忆配对）=====
  if (lessonState.gameMode === 'memory') {
    // 抽 3 对：单词卡（英文）+ 图片卡（只选有配图的单词）
    var pool = lessonState.topic.words.filter(function(w) { return w.img; });
    var pairWords = shuffle(pool).slice(0, 3);
    var memCards = [];
    pairWords.forEach(function(w) {
      memCards.push({ type: 'word', word: w.en, img: null });
      memCards.push({ type: 'pic', word: w.en, img: w.img });
    });
    memCards = shuffle(memCards);

    c.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
        renderLeo('think', 44) +
        '<span style="font-size:15px;font-weight:700;color:var(--text-light)">翻一翻，找朋友：</span>' +
      '</div>' +
      '<div class="game-round-info">第 ' + (lessonState.gameRound + 1) + ' / ' + lessonState.gameTotal + ' 局</div>' +
      '<div class="mem-grid">' +
        memCards.map(function(card, i) {
          return '<div class="mem-card" data-idx="' + i + '">' +
            '<div class="mem-inner">' +
              '<div class="mem-front">' +
                '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z"/></svg>' +
              '</div>' +
              '<div class="mem-back">' +
                (card.type === 'word'
                  ? '<span style="font-family:Fredoka;font-size:22px;font-weight:700;color:var(--primary-dark)">' + card.word + '</span>'
                  : (card.img ? '<img src="' + card.img + '" alt="' + card.word + '" style="width:100%;height:100%;object-fit:contain;border-radius:12px;background:var(--bg-soft);padding:6px">' : card.word)) +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>' +
      '<div id="memFeedback" style="min-height:30px;text-align:center;margin-top:8px"></div>' +
      '<div class="game-score-stars">' + Array(lessonState.gameRound).fill('<span style="font-size:24px">' + starSVG(24) + '</span>').join('') + '</div>';

    var openCards = [];
    var matchedCount = 0;
    var lockBoard = false;
    var fb = document.getElementById('memFeedback');

    function flipBack(cardEl) {
      cardEl.classList.remove('flipped');
    }

    var memEls = document.querySelectorAll('.mem-card');
    memEls.forEach(function(cardEl) {
      cardEl.addEventListener('click', function() {
        if (lockBoard) return;
        if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
        sfxClick();
        cardEl.classList.add('flipped');
        var idx = parseInt(cardEl.getAttribute('data-idx'));
        openCards.push({ el: cardEl, card: memCards[idx] });
        if (openCards.length === 2) {
          lockBoard = true;
          var first = openCards[0], second = openCards[1];
          if (first.card.word === second.card.word && first.card.type !== second.card.type) {
            // 配对成功
            matchedCount++;
            first.el.classList.add('matched');
            second.el.classList.add('matched');
            sfxCorrect();
            fb.innerHTML = '<span style="font-size:15px;font-weight:700;color:var(--green)">配对成功！</span>';
            openCards = [];
            lockBoard = false;
            if (matchedCount === pairWords.length) {
              // 本局完成
              lessonState.gameAnswered = true;
              lessonState.gameScore += 3;
              state.gameCorrect = (state.gameCorrect || 0) + 3;
              saveState();
              fb.innerHTML = '<span style="font-size:16px;font-weight:700;color:var(--green)">全部配对了！太棒了！</span>';
              speak(randomItem(PRAISE_CORRECT), { rate: 0.9, pitch: 1.25 });
              setTimeout(function() {
                lessonState.gameRound++;
                renderLesson(document.getElementById('app'));
              }, 2000);
            }
          } else {
            // 不匹配
            fb.innerHTML = '<span style="font-size:15px;font-weight:700;color:var(--blue)">再试一次！</span>';
            sfxWrong();
            setTimeout(function() {
              first.el.classList.remove('flipped');
              second.el.classList.remove('flipped');
              openCards = [];
              lockBoard = false;
              fb.innerHTML = '';
            }, 900);
          }
        }
      });
    });

    return;
  }

  var optionsHtml = options.map(function(opt) {
    if (isLookMode) {
      return '<div class="game-option game-option-textonly" data-answer="' + opt.en + '"><div class="game-option-text" style="font-size:22px">' + opt.en + '</div></div>';
    }
    var visual = '';
    if (opt.img) visual = '<img src="' + opt.img + '" alt="' + opt.en + '">';
    else if (opt.color) visual = '<div class="game-option-color" style="background:' + opt.color + '"></div>';
    else if (opt.num) visual = '<div style="font-size:36px;font-weight:700;font-family:Fredoka;color:var(--purple)">' + opt.num + '</div>';
    return '<div class="game-option" data-answer="' + opt.en + '">' + visual + '<div class="game-option-text">' + opt.en + '</div></div>';
  }).join('');

  var starsHtml = Array(lessonState.gameRound).fill('<span style="font-size:24px">' + starSVG(24) + '</span>').join('');

  if (isLookMode) {
    c.innerHTML =
      '<div class="game-round-info">第 ' + (lessonState.gameRound + 1) + ' / ' + lessonState.gameTotal + ' 题</div>' +
      '<div style="text-align:center;margin:8px 0">' +
        '<img src="' + (correctWord.img || '') + '" style="width:130px;height:130px;object-fit:contain;border-radius:20px;background:var(--bg-soft);padding:10px;box-shadow:var(--shadow)">' +
      '</div>' +
      '<div class="game-instruction">这是什么？</div>' +
      '<div class="game-options">' + optionsHtml + '</div>' +
      '<div class="game-score-stars" id="gameStars">' + starsHtml + '</div>';
  } else {
    c.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
        renderLeo('happy', 44) +
        '<span style="font-size:15px;font-weight:700;color:var(--text-light)">' + (lessonState.gameRound === 0 ? '仔细听哦：' : '继续加油：') + '</span>' +
      '</div>' +
      '<div class="game-round-info">第 ' + (lessonState.gameRound + 1) + ' / ' + lessonState.gameTotal + ' 题</div>' +
      '<div class="game-instruction">听一听，点一点</div>' +
      '<button class="game-listen-btn" id="gameListen">' + speakerSVG(36) + '</button>' +
      '<div class="game-options">' + optionsHtml + '</div>' +
      '<div class="game-score-stars" id="gameStars">' + starsHtml + '</div>';

    setTimeout(function() { speakWord(correctWord, { rate: 0.8 }); }, 400);
  }

  var listenBtn = document.getElementById('gameListen');
  if (listenBtn) {
    listenBtn.addEventListener('click', function() {
      speakWord(correctWord, { rate: 0.8 });
    });
  }

  var optEls = document.querySelectorAll('.game-option');
  optEls.forEach(function(el) {
    el.addEventListener('click', function() {
      if (lessonState.gameAnswered) return;
      lessonState.gameAnswered = true;
      var answer = el.getAttribute('data-answer');
      if (answer === lessonState.gameAnswer) {
        el.classList.add('correct');
        lessonState.gameScore++;
        state.gameCorrect = (state.gameCorrect || 0) + 1;
        saveState();
        sfxCorrect();
        // 地道英语表扬，营造沉浸式语境
        speak(randomItem(PRAISE_CORRECT), { rate: 0.9, pitch: 1.25 });
        setTimeout(function() {
          lessonState.gameRound++;
          renderLesson(document.getElementById('app'));
        }, 1800);
      } else {
        el.classList.add('wrong');
        sfxWrong();
        // 温柔引导，绝不批评
        var tryMsg = randomItem(PRAISE_TRYAGAIN);
        if (tryMsg.match(/[a-zA-Z]/)) {
          speak(tryMsg, { rate: 0.85, pitch: 1.2 });
        } else {
          speakZh(tryMsg);
        }
        lessonState.gameAnswered = false;
        setTimeout(function() { el.classList.remove('wrong'); }, 800);
      }
    });
  });
}

function finishGame() {
  // 计算星星 (至少1颗，满分3颗)
  var ratio = lessonState.gameScore / lessonState.gameTotal;
  var starsEarned = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : 1;

  state.stars += starsEarned;
  state.totalLessons++;

  // 更新连续天数
  var today = getTodayKey();
  if (state.lastPlayDate !== today) {
    var yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    var yKey = yesterday.getFullYear() + "-" + (yesterday.getMonth()+1) + "-" + yesterday.getDate();
    if (state.lastPlayDate === yKey) {
      state.streak++;
    } else {
      state.streak = 1;
    }
    state.lastPlayDate = today;
    if (state.streak > state.longestStreak) state.longestStreak = state.streak;
  }
  if (state.completedDates.indexOf(today) === -1) {
    state.completedDates.push(today);
  }

  // 日学习数据
  state.weeklyData[today] = (state.weeklyData[today] || 0) + 1;

  saveState();
  lessonState.step = 4;
  lessonState.starsEarned = starsEarned;
  renderLesson(document.getElementById('app'));
}

function getWeekKey() {
  var d = new Date();
  var day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}

function renderReward() {
  var c = document.getElementById('lessonContent');
  var stars = lessonState.starsEarned || 1;
  var starsHtml = '';
  for (var i = 0; i < 3; i++) {
    var opacity = i < stars ? 1 : 0.2;
    starsHtml += '<span class="reward-star" style="opacity:' + opacity + '">' + starSVG(48) + '</span>';
  }

  // 完成文案（翻翻乐用配对张数）
  var doneText = lessonState.gameMode === 'memory'
    ? '你今天配对了 ' + lessonState.gameScore + ' 张卡片'
    : '你今天答对了 ' + lessonState.gameScore + ' / ' + lessonState.gameTotal + ' 题';

  // 明日主题预告
  var topicKeys = Object.keys(TOPICS);
  var tomorrowIdx = (getDayOfYear() + 1) % topicKeys.length;
  var tomorrowTopic = TOPICS[topicKeys[tomorrowIdx]];

  c.innerHTML =
    '<div class="reward-container">' +
      '<div class="reward-mascot leo-pop-in">' + renderLeo('excited', 92, 'border-radius:50%') + '</div>' +
      '<div class="reward-title">太棒了！</div>' +
      '<div class="reward-sub">' + doneText + '</div>' +
      '<div class="reward-stars">' + starsHtml + '</div>' +
      '<div class="reward-tomorrow">' +
        '<div style="font-size:13px;font-weight:700;color:var(--text-light)">明天我们学</div>' +
        '<div style="display:inline-flex;align-items:center;gap:8px;background:' + tomorrowTopic.color + '22;padding:8px 18px;border-radius:20px;margin-top:6px">' +
          '<span style="width:26px;height:26px;border-radius:8px;background:' + tomorrowTopic.color + ';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:Fredoka">' + tomorrowTopic.name.charAt(0) + '</span>' +
          '<span style="font-size:15px;font-weight:700;color:var(--text)">' + tomorrowTopic.name + '</span>' +
        '</div>' +
      '</div>' +
      '<button class="btn btn-primary" id="rewardHome">回到首页</button>' +
    '</div>';

  launchConfetti();
  for (var si = 0; si < stars; si++) {
    setTimeout(function() { sfxStar(); }, 300 + si * 350);
  }
  setTimeout(function() {
    speak(randomItem(PRAISE_COMPLETE), { rate: 0.9, pitch: 1.25 });
    setTimeout(function() { speakZh('明天我们学' + tomorrowTopic.name + '！'); }, 2200);
  }, 700);

  document.getElementById('rewardHome').addEventListener('click', function() {
    speak("Goodbye for now! See you tomorrow, little star!");
    setTimeout(function() { navigate('home'); }, 1800);
  });
}

// ----- 单词库 -----
function renderWords(app) {
  var cats = Object.keys(TOPICS);
  var cardsHtml = cats.map(function(key) {
    var t = TOPICS[key];
    return '<div class="category-card" data-cat="' + key + '">' +
      '<div class="category-icon" style="background:' + t.color + '22">' +
        '<span style="font-size:24px;font-weight:700;color:' + t.color + ';font-family:Fredoka">' + t.name.charAt(0) + '</span>' +
      '</div>' +
      '<div class="category-name">' + t.name + '</div>' +
      '<div class="category-count">' + t.words.length + ' 个单词</div>' +
    '</div>';
  }).join('');

  app.innerHTML =
    '<div class="page-header">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
        '<button class="back-btn" id="wordsBack">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="page-title">单词库</div>' +
      '<div class="page-sub">点一点，听一听，学一学</div>' +
    '</div>' +
    '<div class="category-grid">' + cardsHtml + '</div>';

  document.getElementById('wordsBack').addEventListener('click', function() { navigate('home'); });
  var cards = document.querySelectorAll('.category-card');
  cards.forEach(function(card) {

// ===== CVC 拼读游戏 =====
var cvcState = { idx: 0, slots: [], shuffled: [], correct: 0, initialized: false };

function shuffleArray(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function renderCVCGame(app) {
  if (!cvcState.initialized || cvcState.idx >= CVC_WORDS.length) {
    cvcState = { idx: 0, slots: [], shuffled: [], correct: 0, initialized: true };
    cvcState.shuffled = shuffleArray(CVC_WORDS.slice());
  }

  var item = cvcState.shuffled[cvcState.idx];
  var progress = Math.round((cvcState.idx / CVC_WORDS.length) * 100);

  // 生成可选字母（正确3个 + 干扰3个）
  var allLetters = "abcdefghijklmnopqrstuvwxyz".split("");
  var correctLetters = item.letters;
  var distractors = [];
  while (distractors.length < 3) {
    var r = allLetters[Math.floor(Math.random() * 26)];
    if (correctLetters.indexOf(r) === -1 && distractors.indexOf(r) === -1) {
      distractors.push(r);
    }
  }
  var options = shuffleArray(correctLetters.concat(distractors));

  var slotsHtml = [0,1,2].map(function(i) {
    var s = cvcState.slots[i] || '';
    return '<div class="cvc-slot' + (s ? ' filled' : '') + '" data-idx="' + i + '">' + s + '</div>';
  }).join('');

  var allFilled = cvcState.slots.length === 3 && cvcState.slots.every(function(s) { return s; });
  var isCorrect = allFilled && cvcState.slots.join('') === item.word;
  var isWrong = allFilled && !isCorrect;

  var backSvg = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';

  app.innerHTML =
    '<div class="page-header">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
        '<button class="back-btn" id="cvcBack">' + backSvg + '</button>' +
      '</div>' +
      '<div class="page-title">拼读小达人</div>' +
      '<div class="page-sub">把字母拼起来，读一读</div>' +
      '<div class="phonics-progress">' +
        '<div class="phonics-progress-bar"><div class="phonics-progress-fill" style="width:' + progress + '%"></div></div>' +
        '<div class="phonics-progress-text">第 ' + (cvcState.idx + 1) + ' / ' + CVC_WORDS.length + ' 个 · 已拼对 ' + cvcState.correct + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="cvc-target">' +
      '<div class="cvc-emoji">' + item.emoji + '</div>' +
      '<div class="cvc-zh">' + item.zh + '</div>' +
      '<button class="speak-btn" id="cvcListen" style="margin-top:8px;font-size:14px;padding:8px 16px">' + speakerSVG(20) + ' 听一遍</button>' +
    '</div>' +
    '<div class="cvc-slots">' + slotsHtml + '</div>' +
    (isCorrect ? '<div class="cvc-result ok">太棒了！' + item.word + ' 🎉</div>' : '') +
    (isWrong ? '<div class="cvc-result no">再想想，点字母重拼一次</div>' : '') +
    '<div class="cvc-options">' +
      options.map(function(l) {
        var used = cvcState.slots.indexOf(l) !== -1;
        return '<button class="cvc-letter' + (used ? ' used' : '') + '" data-letter="' + l + '"' + (used ? ' disabled' : '') + '>' + l + '</button>';
      }).join('') +
    '</div>' +
    (isCorrect ? '<button class="btn btn-green" id="cvcNext" style="margin:8px 20px 20px;width:calc(100% - 40px)">下一个 →</button>' : '') +
    (isWrong ? '<button class="btn btn-orange" id="cvcReset" style="margin:8px 20px 20px;width:calc(100% - 40px)">重新拼</button>' : '');

  document.getElementById('cvcBack').addEventListener('click', function() { navigate('phonics'); });

  document.getElementById('cvcListen').addEventListener('click', function() {
    sfxClick();
    speakWord(item.word, { rate: 0.7 });
  });

  app.querySelectorAll('.cvc-letter').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (btn.classList.contains('used')) return;
      sfxClick();
      var letter = btn.getAttribute('data-letter');
      var emptyIdx = -1;
      for (var i = 0; i < 3; i++) { if (!cvcState.slots[i]) { emptyIdx = i; break; } }
      if (emptyIdx === -1) return;
      cvcState.slots[emptyIdx] = letter;
      speak(letter, { rate: 0.8 });
      var filled = cvcState.slots.filter(function(s) { return s; }).length;
      if (filled === 3) {
        setTimeout(function() {
          var guess = cvcState.slots.join('');
          if (guess === item.word) {
            sfxCorrect();
            cvcState.correct++;
            state.stars = (state.stars || 0) + 1;
            saveState();
            launchConfetti();
            speakZh('太棒了，拼对啦！', { rate: 0.95 });
            setTimeout(function() { speakWord(item.word, { rate: 0.65 }); }, 700);
          } else {
            sfxWrong();
            speakZh('再想想哦', { rate: 0.95 });
          }
          renderCVCGame(app);
        }, 500);
        return;
      }
      renderCVCGame(app);
    });
  });

  app.querySelectorAll('.cvc-slot').forEach(function(slot) {
    slot.addEventListener('click', function() {
      var idx = parseInt(slot.getAttribute('data-idx'));
      if (cvcState.slots[idx]) {
        sfxClick();
        cvcState.slots[idx] = '';
        renderCVCGame(app);
      }
    });
  });

  var nextBtn = document.getElementById('cvcNext');
  if (nextBtn) {
    nextBtn.addEventListener('click', function() {
      sfxClick();
      cvcState.idx++;
      cvcState.slots = [];
      if (cvcState.idx >= CVC_WORDS.length) {
        speakZh('太厉害了，全部拼完啦！', { rate: 0.95 });
        cvcState.idx = 0;
        cvcState.correct = 0;
        cvcState.shuffled = shuffleArray(CVC_WORDS.slice());
      }
      renderCVCGame(app);
    });
  }

  var resetBtn = document.getElementById('cvcReset');
  if (resetBtn) {
    resetBtn.addEventListener('click', function() {
      sfxClick();
      cvcState.slots = [];
      renderCVCGame(app);
    });
  }
}

function renderPhonemeDetail(app) {
  var p = currentPhoneme;
  if (!p) { navigate('phonemes'); return; }
  var cat = PHONEME_CATEGORIES.find(function(c) { return PHONEMES[c.id].indexOf(p) !== -1; });
  var learned = (state.learnedPhonemes || []).indexOf(p.ipa) !== -1;
  var wordObj = findWord(p.word);
  var wordZh = wordObj ? wordObj.zh : (p.wordZh || p.word);

  var extra = PHONEME_EXTRA[p.ipa] || { words: [], conf: [] };
  var tips = PHONEME_TIPS[p.ipa] || { mouth:"", tongue:"", tip:p.tip || "", warn:"" };

  document.getElementById('phmRead').addEventListener('click', function() {

        return;

// ===== 最小对立对辨音大挑战 =====
var phonemeQuizState = { questions: [], idx: 0, correct: 0, answered: false };

function renderPhonemeQuiz(app) {
  // 初始化题目：随机选8组对立对
  if (!phonemeQuizState.questions.length || phonemeQuizState.idx >= phonemeQuizState.questions.length) {
    var shuffled = MINIMAL_PAIRS.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
    }
    phonemeQuizState.questions = shuffled.slice(0, 8);
    phonemeQuizState.idx = 0;
    phonemeQuizState.correct = 0;
  }

  var q = phonemeQuizState.questions[phonemeQuizState.idx];
  var total = phonemeQuizState.questions.length;
  var pct = Math.round(phonemeQuizState.idx / total * 100);

  // 随机决定哪个是正确答案
  var swap = Math.random() > 0.5;
  var left = swap ? q.word2 : q.word1;
  var right = swap ? q.word1 : q.word2;
  var leftIpa = swap ? q.ipa2 : q.ipa1;
  var rightIpa = swap ? q.ipa1 : q.ipa2;
  var leftZh = swap ? q.zh2 : q.zh1;
  var rightZh = swap ? q.zh1 : q.zh2;
  var answer = swap ? q.word2 : q.word1;

  app.innerHTML =
    '<div class="page-header">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
        '<button class="back-btn" id="pqBack">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="page-title">辨音大挑战</div>' +
      '<div class="page-sub">听一听，点出你听到的单词</div>' +
      '<div class="phoneme-progress">' +
        '<div style="font-size:13px;font-weight:700;color:var(--text-light)">第 ' + (phonemeQuizState.idx + 1) + ' / ' + total + ' 题 · 答对 ' + phonemeQuizState.correct + ' 题</div>' +
        '<div class="bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
    '</div>' +
    '<div style="padding:0 16px">' +
      '<div style="text-align:center;margin:16px 0 8px">' +
        '<button class="btn btn-primary" id="pqPlay" style="padding:16px 32px;font-size:18px;border-radius:20px">' +
          '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-5px;margin-right:6px"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
          '点我听一听' +
        '</button>' +
      '</div>' +
      '<div style="font-size:13px;color:var(--text-light);text-align:center;margin-bottom:16px;font-weight:600">👆 先点上面的按钮听发音，再点下面的卡片</div>' +
      '<div style="display:flex;gap:12px;margin-bottom:16px">' +
        '<div class="pq-card" data-word="' + left + '" style="flex:1">' +
          renderPhonemeWordImg(left, 72) +
          '<div style="font-size:20px;font-weight:700;color:var(--text);margin-top:8px;font-family:Fredoka">' + left + '</div>' +
          '<div style="font-size:13px;color:var(--text-light);font-weight:600">/' + leftIpa + '/</div>' +
          '<div style="font-size:12px;color:var(--text-light)">' + leftZh + '</div>' +
        '</div>' +
        '<div class="pq-card" data-word="' + right + '" style="flex:1">' +
          renderPhonemeWordImg(right, 72) +
          '<div style="font-size:20px;font-weight:700;color:var(--text);margin-top:8px;font-family:Fredoka">' + right + '</div>' +
          '<div style="font-size:13px;color:var(--text-light);font-weight:600">/' + rightIpa + '/</div>' +
          '<div style="font-size:12px;color:var(--text-light)">' + rightZh + '</div>' +
        '</div>' +
      '</div>' +
      '<div id="pqResult" style="text-align:center;min-height:40px"></div>' +
      '<div style="display:flex;gap:10px;margin-top:8px">' +
        '<button class="btn btn-secondary" id="pqReplay" style="flex:1">🔁 再听一遍</button>' +
        '<button class="btn btn-primary" id="pqNext" style="flex:1;display:none">下一题 →</button>' +
      '</div>' +
    '</div>';

  phonemeQuizState.answered = false;

  document.getElementById('pqBack').addEventListener('click', function() {
    phonemeQuizState.questions = [];
    navigate('phonemes');
  });

  function playQuestion() {
    sfxClick();
    speakWord(answer, { onEnd: function() {} });
  }

  document.getElementById('pqPlay').addEventListener('click', playQuestion);
  document.getElementById('pqReplay').addEventListener('click', playQuestion);

  document.querySelectorAll('.pq-card').forEach(function(card) {
    card.addEventListener('click', function() {
      if (phonemeQuizState.answered) return;
      phonemeQuizState.answered = true;
      sfxClick();
      var chosen = card.getAttribute('data-word');
      var resultEl = document.getElementById('pqResult');
      var nextBtn = document.getElementById('pqNext');
      if (chosen === answer) {
        phonemeQuizState.correct++;
        card.style.background = '#d4edda';
        card.style.borderColor = '#2ECC71';
        resultEl.innerHTML = '<div style="color:#2ECC71;font-size:18px;font-weight:700">🎉 答对啦！太棒了！</div>';
        sfxStar();
        speak(randomItem(PRAISE_CORRECT), { rate: 0.9, pitch: 1.2 });
        launchConfetti();
        // 提升相关音标掌握度
        [q.ipa1, q.ipa2].forEach(function(ipa) {
          var cur = state.phonemeMastery[ipa] || 0;
          if (cur < 3) { state.phonemeMastery[ipa] = Math.min(3, cur + 1); }
        });
        saveState();
      } else {
        card.style.background = '#f8d7da';
        card.style.borderColor = '#E74C3C';
        // 高亮正确答案
        document.querySelectorAll('.pq-card').forEach(function(c) {
          if (c.getAttribute('data-word') === answer) {
            c.style.background = '#d4edda';
            c.style.borderColor = '#2ECC71';
          }
        });
        resultEl.innerHTML = '<div style="color:#E74C3C;font-size:16px;font-weight:700">😊 再听一遍试试吧！正确答案是 ' + answer + '</div>';
        speakZh('没关系，再听一遍试试！正确答案是' + answer);
        // 答错可以重选
        phonemeQuizState.answered = false;
        setTimeout(function() {
          document.querySelectorAll('.pq-card').forEach(function(c) {
            c.style.background = '';
            c.style.borderColor = '';
          });
          resultEl.innerHTML = '';
        }, 2500);
        return;
      }
      nextBtn.style.display = 'block';
    });
  });

  document.getElementById('pqNext').addEventListener('click', function() {
    sfxClick();
    phonemeQuizState.idx++;
    if (phonemeQuizState.idx >= phonemeQuizState.questions.length) {
      // 完成
      var score = phonemeQuizState.correct;
      var totalQ = phonemeQuizState.questions.length;
      app.innerHTML =
        '<div class="page-header">' +
          '<div class="page-title">挑战完成！</div>' +
        '</div>' +
        '<div style="text-align:center;padding:20px">' +
          '<div style="font-size:64px;margin-bottom:12px">' + (score >= 6 ? '🏆' : score >= 4 ? '⭐' : '💪') + '</div>' +
          '<div style="font-size:24px;font-weight:700;color:var(--text);margin-bottom:8px">答对 ' + score + ' / ' + totalQ + ' 题</div>' +
          '<div style="font-size:16px;color:var(--text-light);margin-bottom:20px;font-weight:600">' +
            (score >= 6 ? '太厉害了！你的耳朵真灵敏！' : score >= 4 ? '不错哦！继续练习会更棒！' : '加油！多听几遍就能分清啦！') +
          '</div>' +
          '<div style="display:flex;gap:10px">' +
            '<button class="btn btn-primary" id="pqAgain" style="flex:1">🔄 再来一轮</button>' +
            '<button class="btn btn-secondary" id="pqBack2" style="flex:1">返回音标</button>' +
          '</div>' +
        '</div>';
      if (score >= 4) { sfxStar(); launchConfetti(); }
      document.getElementById('pqAgain').addEventListener('click', function() {
        phonemeQuizState.questions = [];
        phonemeQuizState.idx = 0;
        phonemeQuizState.correct = 0;
        renderPhonemeQuiz(app);
      });
      document.getElementById('pqBack2').addEventListener('click', function() {
        phonemeQuizState.questions = [];
        navigate('phonemes');
      });
    } else {
      renderPhonemeQuiz(app);
    }
  });
}

function showPhonicsModal(p) {
  var learned = (state.learnedLetters || []).indexOf(p.letter) !== -1;
  var examplesHtml = p.examples.map(function(ex) {

function playSingleLine(idx) {
  if (!currentSong) return;
  songStopRequested = true; // 终止整首递归
  stopMelody();
  window.speechSynthesis && window.speechSynthesis.cancel();
  clearSongHighlights();
  songPlayingLine = idx;
  var el = document.getElementById('songLine' + idx);
  if (el) el.classList.add('active');
  var line = currentSong.lines[idx];
  var melody = currentSong.melody ? currentSong.melody[idx] : null;
  if (melody) {
    // 唱这句歌词（单词跟着旋律唱），唱完再慢速带读
    singLyricLine(line, melody, null, function() {
      setTimeout(function() { speak(line, { rate: 0.62, pitch: 1.08 }); }, 250);
    });
  } else {
    speak(line, { rate: 0.7, pitch: 1.1 });
  }
}

function playSongLines(startIdx) {
  if (!currentSong || startIdx >= currentSong.lines.length) {
    clearSongHighlights();
    return;
  }
  if (songStopRequested) return;

  // ===== 真人演唱模式：有 MP3 时直接播放真人演唱 =====
  if (currentSong.mp3 && startIdx === 0) {
    clearSongHighlights();
    if (songAudio) { try { songAudio.pause(); } catch(e) {} }
    songAudio = new Audio(currentSong.mp3);
    songAudio.volume = 0.9;
    var totalLines = currentSong.lines.length;
    songAudio.addEventListener('loadedmetadata', function() {
      if (songStopRequested) return;
      var dur = songAudio.duration;
      // 按歌词行数平均分配时间，逐行高亮
      var perLine = dur / totalLines;
      for (var i = 0; i < totalLines; i++) {
        (function(idx) {
          var t = setTimeout(function() {
            if (songStopRequested) return;
            clearSongHighlights();
            var el = document.getElementById('songLine' + idx);
            if (el) el.classList.add('active');
          }, idx * perLine * 1000);
          melodyTimers.push(t);
        })(i);
      }
    });
    songAudio.addEventListener('ended', function() {
      clearSongHighlights();
      songStopRequested = false;
    });
    songAudio.addEventListener('error', function() {
      // MP3 加载失败，回退到合成器跟唱
      clearSongHighlights();
      songStopRequested = false;
      playSongLinesSynth(0);
    });
    songAudio.play().catch(function() {
      // 自动播放被阻止，回退
      clearSongHighlights();
      songStopRequested = false;
      playSongLinesSynth(0);
    });
    return;
  }

  playSongLinesSynth(startIdx);
}

// 合成器跟唱模式（无 MP3 或单行播放时使用）
function playSongLinesSynth(startIdx) {
  if (!currentSong || startIdx >= currentSong.lines.length) {
    clearSongHighlights();
    return;
  }
  if (songStopRequested) return;
  clearSongHighlights();
  songPlayingLine = startIdx;
  var el = document.getElementById('songLine' + startIdx);
  if (el) el.classList.add('active');
  var line = currentSong.lines[startIdx];
  var melody = currentSong.melody ? currentSong.melody[startIdx] : null;

  var pending = 0;
  var finished = false;
  function fin() {
    if (finished) return;
    pending--;
    if (pending <= 0) {
      finished = true;
      if (!songStopRequested) {
        setTimeout(function() { playSongLinesSynth(startIdx + 1); }, 500);
      }
    }
  }
  if (melody) {
    pending++;
    singLyricLine(line, melody, null, function() {
      if (!songStopRequested) {
        speak(line, { rate: 0.62, pitch: 1.08 });
      }
      fin();
    });
  } else {
    pending++;
    var utter = speak(line, { rate: 0.7, pitch: 1.1 });
    if (utter && utter.onend !== undefined) {
      utter.onend = fin;
    } else {
      setTimeout(fin, estimateMelodyMs(melody) + 800);
    }
    setTimeout(fin, estimateMelodyMs(melody) + 3500);
  }
}

function clearSongHighlights() {
  var els = document.querySelectorAll('.song-line.active');
  els.forEach(function(el) { el.classList.remove('active'); });
}

function getWeekDays() {
  var labels = ['一', '二', '三', '四', '五', '六', '日'];
  var days = [];
  var now = new Date();
  var day = now.getDay() || 7;
  var monday = new Date(now);
  monday.setDate(now.getDate() - day + 1);
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push({
      label: labels[i],
      key: d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate()
    });
  }
  return days;
}

//  初始化
// ============================================================
loadState();

// ===== 全局点读：点击任何带 data-speakable 的英文就发音 =====
document.addEventListener('click', function(e) {
  var el = e.target.closest('[data-speakable]');
  if (!el) return;
  // 避免和按钮自身的点击事件冲突
  if (el.tagName === 'BUTTON' && el.getAttribute('data-speakable') === 'self') return;
  var text = el.getAttribute('data-speakable') || el.textContent.trim();
  if (!text) return;
  sfxClick();
  // 单词优先用真人发音
  var wordObj = findWord(text.toLowerCase());
  if (wordObj) {
    speakWord(wordObj);
  } else {
    speak(text, { rate: 0.75 });
  }
  // 视觉反馈
  el.style.transition = 'transform 0.15s';
  el.style.transform = 'scale(0.92)';
  setTimeout(function() { el.style.transform = ''; }, 150);
});

// 底部导航
document.querySelectorAll('.nav-item').forEach(function(item) {
  item.addEventListener('click', function() {
    var route = item.getAttribute('data-route');
    if (route === 'parent') parentUnlocked = false;
    navigate(route);
  });
});

// 初始路由
var initHash = location.hash.replace('#', '') || 'home';
currentRoute = initHash;
render();
updateNav();

// 注册 Service Worker（PWA 离线支持，仅在 http/https 下生效）
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  });
}

// ===== 启动欢迎页：点击解锁声音 =====
var soundUnlocked = false;
function unlockSound() {
  if (soundUnlocked) return;
  soundUnlocked = true;
  ensureAudio();
  // 播放一个无声音解锁音频上下文
  try {
    var ctx = ensureAudio();
    if (ctx) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.frequency.value = 1;
      gain.gain.value = 0;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.01);
    }
  } catch(e) {}
  // 解锁 TTS：安卓/PWA 下需要在用户手势中触发一次 speak 才能激活
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.resume();
      var warmup = new SpeechSynthesisUtterance(' ');
      warmup.volume = 0;
      warmup.rate = 2;
      window.speechSynthesis.speak(warmup);
    }
  } catch(e) {}
}

// 页面从后台回来时恢复音频（standalone 模式下常见）
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    try { ensureAudio(); } catch(e) {}
    try { if ('speechSynthesis' in window) window.speechSynthesis.resume(); } catch(e) {}
  }
});

document.getElementById('splashStart').addEventListener('click', function() {
  unlockSound();
  var splash = document.getElementById('splash-screen');
  splash.classList.add('hidden');
  setTimeout(function() { splash.style.display = 'none'; }, 500);
  // 欢迎语音：真人配音（亲切女老师），不再走机械TTS
  setTimeout(function() {
    playRealAudio('https://aka.doubaocdn.com/s/JdO4nWbV1b');
    leoTalk('mascotTap', '小朋友好，欢迎来到英语小乐园！', 3200);
  }, 300);
});

// ===== PWA 安装应用 =====
var deferredPrompt = null;
var isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  if (currentRoute === 'home') render();
});

window.addEventListener('appinstalled', function() {
  deferredPrompt = null;
  if (currentRoute === 'home') render();
});

// 只要不是已安装的 standalone 模式，就显示安装横幅
function showInstallBanner() {
  return !isStandalone;
}

// 是否支持一键原生安装（Chrome/Edge 等）
function canNativeInstall() {
  return deferredPrompt !== null;
}

function installApp() {
  if (!deferredPrompt) {
    // 不支持原生安装时，弹出手动指引
    showInstallGuide();
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function() {
    deferredPrompt = null;
    if (currentRoute === 'home') render();
  });
}

// 手动安装指引弹窗
function showInstallGuide() {
  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var steps;
  if (isIOS) {
    steps = [
      { icon: 'share', text: '点浏览器底部的「分享」按钮' },
      { icon: 'plus', text: '选「添加到主屏幕」' },
      { icon: 'add', text: '点右上角「添加」' },
    ];
  } else {
    steps = [
      { icon: 'menu', text: '点浏览器右上角的「⋮」菜单' },
      { icon: 'install', text: '选「添加到主屏幕」或「安装应用」' },
      { icon: 'add', text: '点「添加」确认' },
    ];
  }
  var stepsHtml = steps.map(function(s, i) {
    var iconSvg = '';
    if (s.icon === 'share') iconSvg = '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>';
    else if (s.icon === 'plus') iconSvg = '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>';
    else if (s.icon === 'menu') iconSvg = '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>';
    else if (s.icon === 'install') iconSvg = '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>';
    else iconSvg = '<polyline points="20 6 9 17 4 12"/>';
    return '<div class="guide-step">' +
      '<div class="guide-num">' + (i+1) + '</div>' +
      '<div class="guide-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + iconSvg + '</svg></div>' +
      '<div class="guide-text">' + s.text + '</div>' +
    '</div>';
  }).join('');

  var overlay = document.createElement('div');
  overlay.className = 'install-guide-overlay';
  overlay.innerHTML =
    '<div class="install-guide-card">' +
      '<div class="guide-close" id="guideClose">&times;</div>' +
      '<div class="guide-title">装到桌面，像 APP 一样用</div>' +
      '<div class="guide-sub">按下面 3 步操作，桌面就会出现 Leo 图标</div>' +
      stepsHtml +
      '<div class="guide-tip">装好后从桌面图标打开，就是全屏 APP，没有地址栏</div>' +
      '<button class="guide-ok" id="guideOk">我知道了</button>' +
    '</div>';
  document.body.appendChild(overlay);
  setTimeout(function() { overlay.classList.add('show'); }, 10);
  function close() { overlay.classList.remove('show'); setTimeout(function() { overlay.remove(); }, 300); }
  overlay.querySelector('#guideClose').addEventListener('click', close);
  overlay.querySelector('#guideOk').addEventListener('click', close);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
}
</script>
