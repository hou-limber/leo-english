<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF8C42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leo英语">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Leo 英语小乐园</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* ===== 设计变量 ===== */
:root {
  --bg: #FFF8E7;
  --bg-soft: #FFF3D6;
  --card: #FFFFFF;
  --primary: #FFB800;
  --primary-dark: #F5A623;
  --secondary: #4ECDC4;
  --pink: #FF6B9D;
  --blue: #5B9DFB;
  --purple: #A78BFA;
  --green: #6BCB77;
  --orange: #FF8C42;
  --red: #FF6B6B;
  --text: #2D3436;
  --text-light: #8B95A0;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius: 24px;
  --radius-sm: 16px;
  --nav-h: 72px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  user-select: none;
}

body {
  background:
    radial-gradient(circle at 10% 0%, rgba(255,184,0,0.12) 0%, transparent 40%),
    radial-gradient(circle at 90% 20%, rgba(78,205,196,0.1) 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(255,107,157,0.08) 0%, transparent 50%),
    var(--bg);
}

#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(var(--nav-h) + 24px);
  position: relative;
}

/* ===== 通用组件 ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 20px;
  font-family: 'Fredoka', 'Nunito', sans-serif;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  text-decoration: none;
}
.btn:active { transform: scale(0.95); }

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  font-size: 22px;
  padding: 18px 40px;
  box-shadow: 0 6px 0 #E09600, 0 8px 20px rgba(255,184,0,0.4);
  border-radius: 28px;
}
.btn-primary:active { box-shadow: 0 2px 0 #E09600, 0 4px 10px rgba(255,184,0,0.4); transform: translateY(4px) scale(0.98); }

.btn-secondary {
  background: var(--card);
  color: var(--text);
  font-size: 18px;
  padding: 14px 28px;
  box-shadow: var(--shadow);
  border: 3px solid var(--bg-soft);
}

.btn-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--card);
  box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none;
  transition: transform 0.15s;
}
.btn-icon:active { transform: scale(0.9); }

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}

/* ===== 底部导航 ===== */
#bottom-nav {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; max-width: 520px;
  height: var(--nav-h);
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-around;
  align-items: center;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  cursor: pointer; padding: 8px 16px;
  border-radius: 16px;
  transition: background 0.2s;
  color: var(--text-light);
  font-size: 11px; font-weight: 700;
  font-family: 'Fredoka', sans-serif;
}
.nav-item.active { color: var(--primary-dark); }
.nav-item.active .nav-icon { background: var(--bg-soft); }
.nav-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}

/* ===== 首页 ===== */
.home-header {
  padding: 24px 20px 16px;
  display: flex; align-items: center; gap: 16px;
}
.mascot-avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--bg-soft);
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: var(--shadow);
  cursor: pointer;
  border: 3px solid #fff;
  display: flex; align-items: center; justify-content: center;
}
.mascot-avatar img { width: 100%; height: 100%; object-fit: cover; }
.mascot-avatar:active { animation: leoWiggle 0.5s ease; }
.home-greeting h1 {
  font-family: 'Fredoka', sans-serif;
  font-size: 24px; font-weight: 700;
  color: var(--text);
}
.home-greeting p {
  font-size: 14px; color: var(--text-light);
  margin-top: 2px;
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 0 20px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 14px 8px;
  text-align: center;
  box-shadow: var(--shadow);
}
.stat-num {
  font-family: 'Fredoka', sans-serif;
  font-size: 28px; font-weight: 700;
  line-height: 1;
}
.stat-label {
  font-size: 12px; color: var(--text-light);
  margin-top: 4px; font-weight: 600;
}

.lesson-card {
  margin: 0 20px 20px;
  background: linear-gradient(135deg, #FFE8A3 0%, #FFD166 100%);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.lesson-card::after {
  content: '';
  position: absolute;
  right: -20px; top: -20px;
  width: 120px; height: 120px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
}
.lesson-badge {
  display: inline-block;
  background: rgba(255,255,255,0.7);
  color: var(--primary-dark);
  font-size: 12px; font-weight: 800;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 10px;
}
.lesson-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 26px; font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.lesson-sub {
  font-size: 14px; color: rgba(45,52,54,0.7);
  margin-bottom: 18px;
  font-weight: 600;
}
.lesson-start-btn {
  background: #fff;
  color: var(--primary-dark);
  font-size: 20px; font-weight: 700;
  padding: 14px 32px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  font-family: 'Fredoka', sans-serif;
  transition: transform 0.15s;
  position: relative; z-index: 1;
}
.lesson-start-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }

.lesson-done {
  background: linear-gradient(135deg, #A8E6CF 0%, #6BCB77 100%);
}
.lesson-done .lesson-title { color: #1B5E20; }
.lesson-done .lesson-start-btn { color: #2E7D32; }

.quick-section {
  padding: 0 20px;
}
.quick-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 18px; font-weight: 700;
  margin-bottom: 12px;
  color: var(--text);
}
.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.quick-item {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 18px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.15s;
  display: flex; align-items: center; gap: 12px;
}
.quick-item:active { transform: scale(0.97); }
.quick-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.quick-item span {
  font-family: 'Fredoka', sans-serif;
  font-size: 16px; font-weight: 600;
}

.home-section {
  padding: 0 20px;
  margin-top: 20px;
}

/* 日历 */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-dow {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-light);
  padding: 4px 0;
}
.cal-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  color: var(--text-light);
}
.cal-done {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  font-weight: 700;
}
.cal-today {
  border: 2px solid var(--secondary);
}
.cal-empty { aspect-ratio: 1; }

/* 成就徽章 */
.achievement-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 2px 12px;
  -webkit-overflow-scrolling: touch;
}
.achievement {
  flex-shrink: 0;
  width: 72px;
  text-align: center;
}
.achievement-icon {
  width: 52px; height: 52px;
  border-radius: 50%;
  margin: 0 auto 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.achievement.locked .achievement-icon {
  opacity: 0.25;
  filter: grayscale(1);
}
.achievement.locked .achievement-name {
  color: var(--text-light);
  opacity: 0.4;
}
.achievement-name {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}

/* ===== 课程页 ===== */
.lesson-container {
  padding: 20px;
  min-height: calc(100vh - var(--nav-h));
  display: flex;
  flex-direction: column;
}
.lesson-top-bar {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px;
}
.lesson-progress-track {
  flex: 1;
  height: 12px;
  background: var(--bg-soft);
  border-radius: 6px;
  overflow: hidden;
}
.lesson-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  border-radius: 6px;
  transition: width 0.4s ease;
}
.lesson-step-label {
  font-size: 13px; font-weight: 700;
  color: var(--text-light);
  white-space: nowrap;
}

.lesson-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}

/* 暖场 */
.warmup-mascot {
  width: 160px; height: 160px;
  border-radius: 50%;
  background: var(--bg-soft);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  animation: bounce 2s ease-in-out infinite;
}
.warmup-mascot img { width: 100%; height: 100%; object-fit: cover; }
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
.warmup-text {
  font-family: 'Fredoka', sans-serif;
  font-size: 28px; font-weight: 700;
  text-align: center;
  color: var(--text);
}
.warmup-sub {
  font-size: 16px; color: var(--text-light);
  text-align: center; font-weight: 600;
}

/* 单词卡 */
.word-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 28px 24px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  position: relative;
}
.word-card-img {
  width: 140px; height: 140px;
  margin: 0 auto 16px;
  object-fit: contain;
}
.word-card-color-swatch {
  width: 120px; height: 120px;
  border-radius: 50%;
  margin: 0 auto 16px;
  box-shadow: inset 0 -4px 12px rgba(0,0,0,0.15), 0 4px 16px rgba(0,0,0,0.1);
}
.word-card-num {
  font-family: 'Fredoka', sans-serif;
  font-size: 100px; font-weight: 700;
  line-height: 1;
  margin-bottom: 8px;
}
.word-en {
  font-family: 'Fredoka', sans-serif;
  font-size: 36px; font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.word-zh {
  font-size: 18px; color: var(--text-light);
  font-weight: 600;
  margin-bottom: 16px;
}
.word-example {
  font-size: 14px; color: var(--secondary);
  font-style: italic;
  font-weight: 600;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 2px dashed var(--bg-soft);
}
.word-counter {
  position: absolute;
  top: 16px; right: 20px;
  font-family: 'Fredoka', sans-serif;
  font-size: 16px; font-weight: 700;
  color: var(--text-light);
}
.speak-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--secondary), #3DB8B0);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 #2A9D8F, 0 6px 16px rgba(78,205,196,0.4);
  transition: transform 0.15s;
  margin: 0 auto;
}
.speak-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2A9D8F; }
.speak-btn.playing { animation: pulse 1s ease infinite; }
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.mic-btn {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--pink), #E84393);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 #C2185B, 0 6px 16px rgba(255,107,157,0.4);
  transition: transform 0.15s;
}
.mic-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #C2185B; }
.mic-btn.recording {
  animation: micPulse 1s ease infinite;
  background: linear-gradient(135deg, var(--red), #E53935);
}
@keyframes micPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 4px 0 #B71C1C, 0 0 0 0 rgba(255,107,107,0.5); }
  50% { transform: scale(1.08); box-shadow: 0 4px 0 #B71C1C, 0 0 0 14px rgba(255,107,107,0); }
}

/* 自然拼读 */
.phonics-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 32px 24px;
  width: 100%;
  max-width: 360px;
  text-align: center;
}
.phonics-letter {
  font-family: 'Fredoka', sans-serif;
  font-size: 120px; font-weight: 700;
  line-height: 1;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.phonics-sound {
  font-family: 'Fredoka', sans-serif;
  font-size: 28px; font-weight: 600;
  color: var(--purple);
  margin-bottom: 20px;
}
.phonics-examples {
  display: flex; flex-wrap: wrap;
  gap: 8px; justify-content: center;
  margin-top: 16px;
}
.phonics-example-tag {
  background: var(--bg-soft);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 16px; font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: transform 0.15s;
}
.phonics-example-tag:active { transform: scale(0.95); }

/* 游戏 */
.game-instruction {
  font-family: 'Fredoka', sans-serif;
  font-size: 22px; font-weight: 700;
  text-align: center;
  color: var(--text);
}
.game-listen-btn {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--blue), #4A8AE8);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 5px 0 #3A7BD5, 0 8px 20px rgba(91,157,251,0.4);
  transition: transform 0.15s;
  margin: 0 auto;
}
.game-listen-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #3A7BD5; }
.game-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  width: 100%;
  max-width: 380px;
}
.game-option {
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s;
  border: 4px solid transparent;
}
.game-option:active { transform: scale(0.95); }
.game-option.correct {
  border-color: var(--green);
  background: #E8F5E9;
  animation: correctPop 0.4s ease;
}
.game-option.wrong {
  border-color: var(--blue);
  background: #E3F2FD;
  animation: shake 0.4s ease;
}

.game-mode-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: transform 0.15s;
  width: 100%;
  max-width: 360px;
}
.game-mode-card:active { transform: scale(0.97); }
.game-mode-icon {
  width: 56px; height: 56px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.game-option-textonly {
  padding: 20px 16px;
}
.game-option-textonly .game-option-text {
  font-size: 22px;
  font-weight: 700;
}
@keyframes correctPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.game-option img {
  width: 80px; height: 80px;
  object-fit: contain;
  margin-bottom: 8px;
}
.game-option-text {
  font-family: 'Fredoka', sans-serif;
  font-size: 22px; font-weight: 700;
  color: var(--text);
}
.game-option-color {
  width: 60px; height: 60px;
  border-radius: 50%;
  margin: 0 auto 8px;
  box-shadow: inset 0 -3px 8px rgba(0,0,0,0.15);
}
.game-round-info {
  font-size: 14px; font-weight: 700;
  color: var(--text-light);
  text-align: center;
}
.game-score-stars {
  display: flex; gap: 6px; justify-content: center;
}

/* 奖励页 */
.reward-container {
  text-align: center;
  padding: 40px 20px;
}
.reward-mascot {
  width: 140px; height: 140px;
  border-radius: 50%;
  margin: 0 auto 20px;
  background: var(--bg-soft);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  animation: cheer 0.8s ease infinite alternate;
  display: flex; align-items: center; justify-content: center;
}
.reward-mascot img { width: 100%; height: 100%; object-fit: cover; }
@keyframes cheer {
  from { transform: rotate(-5deg) scale(1); }
  to { transform: rotate(5deg) scale(1.05); }
}
.reward-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 32px; font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 8px;
}
.reward-sub {
  font-size: 16px; color: var(--text-light);
  font-weight: 600;
  margin-bottom: 24px;
}
.reward-stars {
  display: flex; justify-content: center; gap: 12px;
  margin-bottom: 32px;
}
.reward-star {
  font-size: 48px;
  animation: starPop 0.5s ease backwards;
}
.reward-star:nth-child(1) { animation-delay: 0.2s; }
.reward-star:nth-child(2) { animation-delay: 0.4s; }
.reward-star:nth-child(3) { animation-delay: 0.6s; }
@keyframes starPop {
  0% { transform: scale(0) rotate(-180deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

/* 彩带 */
.confetti {
  position: fixed;
  top: -10px;
  width: 10px; height: 10px;
  z-index: 200;
  pointer-events: none;
  animation: confettiFall 3s linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ===== 单词库 ===== */
.page-header {
  padding: 24px 20px 16px;
}
.page-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 28px; font-weight: 700;
  color: var(--text);
}
.page-sub {
  font-size: 14px; color: var(--text-light);
  margin-top: 4px; font-weight: 600;
}

.category-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding: 0 20px;
}
.category-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.15s;
  text-align: center;
}
.category-card:active { transform: scale(0.96); }
.category-icon {
  width: 56px; height: 56px;
  border-radius: 16px;
  margin: 0 auto 10px;
  display: flex; align-items: center; justify-content: center;
}
.category-name {
  font-family: 'Fredoka', sans-serif;
  font-size: 18px; font-weight: 700;
  color: var(--text);
}
.category-count {
  font-size: 12px; color: var(--text-light);
  margin-top: 2px; font-weight: 600;
}

.word-list {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.word-row {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 14px;
  cursor: pointer;
  transition: transform 0.15s;
}
.word-row:active { transform: scale(0.98); }
.word-row-thumb {
  width: 52px; height: 52px;
  border-radius: 14px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  background: var(--bg-soft);
}
.word-row-thumb img { width: 100%; height: 100%; object-fit: cover; }
.word-row-info { flex: 1; }
.word-row-en {
  font-family: 'Fredoka', sans-serif;
  font-size: 20px; font-weight: 700;
  color: var(--text);
}
.word-row-zh {
  font-size: 13px; color: var(--text-light);
  font-weight: 600;
}
.word-row-speak {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--bg-soft);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.word-row-speak:active { transform: scale(0.9); }

/* 单词详情弹层 */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 24px;
  width: 100%; max-width: 360px;
  text-align: center;
  box-shadow: var(--shadow-lg);
  animation: modalPop 0.3s ease;
}
@keyframes modalPop {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.modal-close {
  position: absolute;
  top: 12px; right: 12px;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg-soft);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ===== 拼读页 ===== */
.letter-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 0 20px;
}
.letter-tile {
  aspect-ratio: 1;
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform 0.15s;
  font-family: 'Fredoka', sans-serif;
}
.letter-tile:active { transform: scale(0.93); }
.letter-tile-big {
  font-size: 32px; font-weight: 700;
  line-height: 1;
}
.letter-tile-sound {
  font-size: 11px; color: var(--text-light);
  margin-top: 4px; font-weight: 600;
}
.letter-tile.learned {
  background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
  border: 3px solid var(--green);
}
.letter-tile.learned .letter-tile-big { color: #2E7D32; }
.letter-tile.current {
  background: linear-gradient(135deg, #FFF8E1, #FFECB3);
  border: 3px solid var(--primary);
  animation: tilePulse 1.6s ease infinite;
}
.letter-tile.current .letter-tile-big { color: var(--primary-dark); }
.letter-tile.locked {
  opacity: 0.5;
  cursor: default;
}
.letter-tile.locked .letter-tile-big { color: var(--text-light); }
.letter-tile.locked .letter-tile-sound { display: none; }
@keyframes tilePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,184,0,0.45); }
  50% { box-shadow: 0 0 0 10px rgba(255,184,0,0); }
}
.letter-check {
  position: absolute;
  top: 6px; right: 6px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--green);
  display: flex; align-items: center; justify-content: center;
}
.letter-lock {
  position: absolute;
  top: 6px; right: 6px;
  width: 20px; height: 20px;
  color: var(--text-light);
  display: flex; align-items: center; justify-content: center;
}
.letter-tile { position: relative; }

/* ===== CVC 拼读游戏 ===== */
.cvc-target {
  text-align: center;
  padding: 16px 20px 8px;
}
.cvc-emoji {
  font-size: 72px;
  line-height: 1;
  margin-bottom: 8px;
  animation: cvcBounce 2s ease infinite;
}
@keyframes cvcBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.cvc-zh {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.cvc-slots {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 16px 20px;
}
.cvc-slot {
  width: 64px;
  height: 72px;
  background: var(--card);
  border: 3px dashed var(--text-light);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: 700;
  font-family: 'Fredoka', sans-serif;
  color: var(--primary-dark);
  transition: all 0.2s;
}
.cvc-slot.filled {
  border-style: solid;
  border-color: var(--primary);
  background: linear-gradient(135deg, #FFF8E1, #FFECB3);
  animation: cvcPop 0.3s ease;
}
@keyframes cvcPop {
  0% { transform: scale(0.8); }
  60% { transform: scale(1.1); }
  100% { transform: scale(1); }
}
.cvc-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 12px 20px 20px;
  max-width: 360px;
  margin: 0 auto;
}
.cvc-letter {
  aspect-ratio: 1;
  background: var(--card);
  border: 3px solid var(--primary);
  border-radius: 16px;
  font-size: 28px;
  font-weight: 700;
  font-family: 'Fredoka', sans-serif;
  color: var(--primary-dark);
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: var(--shadow);
}
.cvc-letter:active { transform: scale(0.9); }
.cvc-letter.used {
  opacity: 0.3;
  border-color: var(--text-light);
  color: var(--text-light);
  cursor: default;
}
.cvc-result {
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  padding: 8px 20px;
}
.cvc-result.ok { color: var(--green); }
.cvc-result.no { color: var(--red); animation: shake 0.4s; }

/* 点读模式：可点读元素有视觉提示 */
[data-speakable] {
  cursor: pointer;
  position: relative;
  transition: all 0.15s;
}
[data-speakable]:hover {
  opacity: 0.8;
}
[data-speakable]::after {
  content: '🔊';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
[data-speakable]:active::after {
  opacity: 1;
}

/* 拼读学习进度与今日字母 */
.phonics-progress {
  padding: 0 20px;
  margin-bottom: 16px;
}
.phonics-progress-bar {
  height: 12px;
  background: var(--bg-soft);
  border-radius: 10px;
  overflow: hidden;
}
.phonics-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--pink));
  border-radius: 10px;
  transition: width 0.6s ease;
}
.phonics-progress-text {
  font-size: 12px; font-weight: 700; color: var(--text-light);
  margin-top: 6px; text-align: center;
}
.phonics-today {
  margin: 0 20px 16px;
  background: linear-gradient(135deg, #FFF9E6, #FFF3CD);
  border-radius: var(--radius);

  box-shadow: var(--shadow);
  border: 2px solid var(--primary);
}
.phonics-today-title {
  display: flex; align-items: center; gap: 10px;

}
.phonics-today-cards {

}

.phonics-today-letter {

  line-height: 1.1;
}
.phonics-today-sound {
  font-size: 13px; font-weight: 700; color: var(--text-light);
}
.phonics-today-cta {
  position: absolute;
  top: 8px; right: 8px;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--primary);

  display: flex; align-items: center; justify-content: center;
}

/* 字母学习弹层增强 */
.phonics-example-item {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.phonics-example-img {
  width: 64px; height: 64px;
  object-fit: contain;
  border-radius: 14px;
  background: var(--bg-soft);

  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.15s;
}
.phonics-example-img:active { transform: scale(0.92); }
.btn-green {
  background: linear-gradient(135deg, #66BB6A, #43A047);
  color: #fff;
  border: none;
  font-family: 'Fredoka', sans-serif;
  font-size: 17px;
  font-weight: 700;
  padding: 13px 26px;
  border-radius: 30px;

  box-shadow: 0 4px 0 #2E7D32, 0 6px 16px rgba(67,160,71,0.35);

}
.btn-green:active { transform: translateY(3px); box-shadow: 0 1px 0 #2E7D32; }
.btn-learned {
  background: linear-gradient(135deg, #A5D6A7, #81C784);
  color: #fff;
  border: none;
  font-family: 'Fredoka', sans-serif;

  font-weight: 700;
  padding: 13px 26px;
  border-radius: 30px;
  display: inline-flex; align-items: center; gap: 8px;

}

/* ===== 卡通动效 ===== */
@keyframes leoPopIn {
  0% { transform: scale(0) rotate(-12deg); opacity: 0; }
  60% { transform: scale(1.15) rotate(4deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); }
}
.leo-pop-in { animation: leoPopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes leoWiggle {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-8deg) scale(1.05); }
  75% { transform: rotate(8deg) scale(1.05); }
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
.page-fade { animation: pageIn 0.35s ease both; }
@keyframes floatBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* 开场仪式 */
.warmup-mascot { animation: floatBob 2s ease infinite; }
.warmup-topic {
  display: inline-flex; align-items: center; gap: 12px;
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  box-shadow: var(--shadow);
  margin: 6px 0 16px;
}
.warmup-topic-icon {
  width: 44px; height: 44px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; font-family: 'Fredoka', sans-serif;
  flex-shrink: 0;
}

/* 奖励明日预告 */
.reward-tomorrow {
  margin: 8px 0 18px;
  text-align: center;
}

/* ===== 我的花园 ===== */
.garden-box {
  background: linear-gradient(180deg, #E3F7E8 0%, #F6FFF3 70%);
  border-radius: var(--radius);
  padding: 18px 14px;
  box-shadow: var(--shadow);
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: center;
  gap: 6px;
  min-height: 90px;
  border: 2px solid #C8E6C9;
}
.garden-flower {
  animation: flowerGrow 0.5s ease both;
}
@keyframes flowerGrow {
  from { transform: scale(0) translateY(12px); }
  to { transform: scale(1) translateY(0); }
}
.garden-empty {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  color: var(--text-light);

/* ===== 星星商店 ===== */
.store-hero {

}
.store-stars-count {

}
.store-stars-count span {

}
.store-leo { animation: floatBob 2.5s ease infinite; }
.store-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 20px;
}
.store-card {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 16px 14px;
  box-shadow: var(--shadow);

}
.store-gear-preview {
  width: 84px; height: 84px;
  margin: 0 auto 10px;
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
}
.store-name {
  font-family: 'Fredoka', sans-serif;
  font-size: 16px; font-weight: 700; color: var(--text);
}
.store-desc {
  font-size: 11px; color: var(--text-light); font-weight: 600;
  margin: 4px 0 10px;
}
.store-buy-btn {
  background: linear-gradient(135deg, var(--primary), #FFB300);
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: 9px 18px;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  box-shadow: 0 3px 0 #E6A000, 0 4px 10px rgba(255,184,0,0.35);
  display: inline-flex; align-items: center;
  transition: transform 0.15s;
}
.store-buy-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #E6A000; }
.store-wear-btn {
  background: linear-gradient(135deg, #66BB6A, #43A047);
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: 9px 22px;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  box-shadow: 0 3px 0 #2E7D32;

}

.store-status {

}
.store-active {
  background: linear-gradient(135deg, #A5D6A7, #81C784);

/* ===== 拼一拼 ===== */
.spell-built {
  display: flex; justify-content: center; gap: 8px;
  min-height: 62px;
  margin: 10px 0 6px;
  padding: 8px;
  border-radius: var(--radius-sm);
  background: var(--bg-soft);
  border: 2px dashed var(--primary);
}
.spell-built-char {
  width: 46px; height: 46px;
  background: linear-gradient(135deg, #FFF8E1, #FFECB3);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fredoka', sans-serif;
  font-size: 26px; font-weight: 700; color: var(--primary-dark);
  animation: popChar 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
}
@keyframes popChar {
  from { transform: scale(0.4); }
  to { transform: scale(1); }
}
.spell-letters {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
  margin: 10px 0;
}
.spell-tile {
  width: 52px; height: 52px;
  background: var(--card);
  border-radius: 14px;
  box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fredoka', sans-serif;
  font-size: 26px; font-weight: 700; color: var(--text);
  cursor: pointer;
  transition: transform 0.15s;
  border: 3px solid transparent;
}
.spell-tile:active { transform: scale(0.9); }
.spell-tile.used {
  opacity: 0.25;
  cursor: default;
  background: var(--bg-soft);
  transform: scale(0.8);
}
.spell-tile.spell-wrong {
  border-color: var(--blue);
  animation: shake 0.4s ease;
}

/* ===== 翻翻乐 ===== */
.mem-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 6px 20px 0;
}
.mem-card {
  aspect-ratio: 1;
  perspective: 600px;
  cursor: pointer;
}
.mem-inner {
  position: relative;
  width: 100%; height: 100%;
  transition: transform 0.45s cubic-bezier(0.4, 0.2, 0.2, 1);
  transform-style: preserve-3d;
}
.mem-card.flipped .mem-inner { transform: rotateY(180deg); }
.mem-front, .mem-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
}
.mem-front {
  background: linear-gradient(135deg, var(--purple), #A78BFA);
  color: #fff;
  box-shadow: 0 4px 12px rgba(167,139,250,0.4);
}
.mem-back {
  background: var(--card);
  box-shadow: var(--shadow);
  transform: rotateY(180deg);
  border: 3px solid var(--secondary);
  overflow: hidden;
}
.mem-card.matched .mem-back {
  border-color: var(--green);
  box-shadow: 0 4px 12px rgba(107,203,119,0.5);
}
.mem-card.matched { animation: matchPop 0.4s ease; }
@keyframes matchPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.12); }
  100% { transform: scale(1); }
}

  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s;
}

/* ===== 家长区 ===== */
.parent-gate {
  padding: 60px 20px;
  text-align: center;
}
.parent-gate-icon {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: var(--bg-soft);
  margin: 0 auto 20px;
  display: flex; align-items: center; justify-content: center;
}
.parent-gate h2 {
  font-family: 'Fredoka', sans-serif;
  font-size: 24px; font-weight: 700;
  margin-bottom: 8px;
}
.parent-gate p {
  font-size: 14px; color: var(--text-light);
  margin-bottom: 24px; font-weight: 600;
}
.long-press-btn {
  background: linear-gradient(135deg, var(--purple), #8B5CF6);
  color: #fff;
  font-size: 18px; font-weight: 700;
  padding: 16px 40px;
  border-radius: 20px;
  border: none; cursor: pointer;
  font-family: 'Fredoka', sans-serif;
  box-shadow: 0 4px 0 #7C3AED;
  transition: transform 0.1s;
  position: relative;
  overflow: hidden;
}
.long-press-btn:active { transform: translateY(2px); }
.long-press-progress {
  position: absolute;
  bottom: 0; left: 0;
  height: 4px;
  background: rgba(255,255,255,0.6);
  width: 0%;
  transition: width 0.1s linear;
}

.parent-stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 20px;
  margin-bottom: 20px;
}
.parent-stat {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 18px;
  box-shadow: var(--shadow);
  text-align: center;
}
.parent-stat-num {
  font-family: 'Fredoka', sans-serif;
  font-size: 32px; font-weight: 700;
}
.parent-stat-label {
  font-size: 13px; color: var(--text-light);
  margin-top: 4px; font-weight: 600;
}

.weekly-chart {
  margin: 0 20px 20px;
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}
.weekly-chart-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 16px; font-weight: 700;
  margin-bottom: 16px;
}
.weekly-bars {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  height: 120px;
  gap: 8px;
}
.weekly-bar-col {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 6px;
}
.weekly-bar {
  width: 100%;
  background: linear-gradient(180deg, var(--primary), var(--primary-dark));
  border-radius: 8px 8px 4px 4px;
  min-height: 4px;
  transition: height 0.5s ease;
}
.weekly-bar-label {
  font-size: 11px; color: var(--text-light);
  font-weight: 700;
}

.parent-actions {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.parent-action-btn {
  background: var(--card);
  border: 2px solid var(--bg-soft);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  font-size: 15px; font-weight: 700;
  color: var(--text);
  cursor: pointer;
  text-align: left;
  display: flex; align-items: center; gap: 12px;
  font-family: 'Nunito', sans-serif;
  transition: transform 0.15s;
}
.parent-action-btn:active { transform: scale(0.98); }
.parent-action-btn.danger { color: var(--red); border-color: #FFCDD2; }

/* ===== 通用 ===== */
.back-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--card);
  box-shadow: var(--shadow);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.back-btn:active { transform: scale(0.9); }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
}

/* ===== 语音定制卡片 ===== */
.voice-card {
  margin: 0 16px 16px;
  background: linear-gradient(135deg, #FFE0B2, #FFCC80);
  border-radius: 20px;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow);
  border: 2px dashed rgba(255,140,66,0.4);
}
.voice-card .voice-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FF8C42, #FF6B9D);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(255,107,107,0.4);
  transition: transform 0.15s;
  position: relative;
}
.voice-card .voice-icon:active { transform: scale(0.92); }
.voice-card .voice-icon.listening { animation: voicePulse 1s ease-in-out infinite; }
@keyframes voicePulse {
  0%, 100% { transform: scale(1); box-shadow: 0 4px 12px rgba(255,107,107,0.4), 0 0 0 0 rgba(255,107,107,0.5); }
  50% { transform: scale(1.08); box-shadow: 0 4px 12px rgba(255,107,107,0.4), 0 0 0 14px rgba(255,107,107,0); }
}
.voice-card .voice-text { flex: 1; }
.voice-card .voice-text .t1 { font-size: 15px; font-weight: 800; color: #7A4A1D; }
.voice-card .voice-text .t2 { font-size: 12px; color: #A06A30; margin-top: 2px; }
.voice-card .voice-status {
  font-size: 13px;
  font-weight: 700;
  color: #7A4A1D;
  background: rgba(255,255,255,0.7);
  border-radius: 12px;
  padding: 4px 10px;
  min-height: 22px;
  text-align: center;
}
.voice-card .voice-status.error { color: #E74C3C; }
.voice-card .voice-status.ok { color: #2ECC71; }

/* 语音定制提示条 */
.voice-toast {
  position: fixed;
  left: 50%;
  bottom: 110px;
  transform: translateX(-50%) translateY(20px);
  background: rgba(45,45,45,0.92);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  padding: 12px 24px;
  border-radius: 24px;
  z-index: 9998;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  max-width: 80vw;
  text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}
.voice-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.voice-toast.ok { background: #2ECC71; }

/* ===== 安装指引弹窗 ===== */
.install-guide-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.3s;
}
.install-guide-overlay.show { opacity: 1; }
.install-guide-card {
  background: #fff;
  border-radius: 24px;
  padding: 24px;
  max-width: 360px;
  width: 100%;
  position: relative;
  transform: scale(0.9);
  transition: transform 0.3s;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.install-guide-overlay.show .install-guide-card { transform: scale(1); }
.guide-close {
  position: absolute;
  top: 12px; right: 16px;
  font-size: 28px;
  color: #999;
  cursor: pointer;
  line-height: 1;
}
.guide-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
  text-align: center;
  margin-bottom: 6px;
  font-family: Fredoka;
}
.guide-sub {
  font-size: 13px;
  color: var(--text-light);
  text-align: center;
  margin-bottom: 20px;
}
.guide-step {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #f0f0f0;
}
.guide-step:last-of-type { border-bottom: none; }
.guide-num {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--orange);
  color: #fff;
  font-weight: 800;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.guide-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.guide-text {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
}
.guide-tip {
  font-size: 12px;
  color: var(--text-light);
  text-align: center;
  margin: 16px 0;
  padding: 10px;
  background: #FFF8F0;
  border-radius: 12px;
}
.guide-ok {
  width: 100%;
  background: linear-gradient(135deg, #FF8C42, #FF6B9D);
  color: #fff;
  border: none;
  padding: 14px;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 800;
  font-family: Fredoka;
  cursor: pointer;
}

/* 定制主题徽章 */
.custom-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #FF6B9D;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  border-radius: 10px;
  padding: 3px 8px;
  margin-left: 8px;
  vertical-align: middle;
}

/* ===== Leo 说话气泡 ===== */
.leo-talk-bubble {
  position: absolute;
  bottom: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  background: #fff;
  border: 3px solid var(--orange);
  border-radius: 18px;
  padding: 10px 14px;
  min-width: 120px;
  max-width: 220px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  z-index: 50;
  animation: bubblePop 0.3s ease;
  text-align: center;
}
@keyframes bubblePop {
  0% { transform: translateX(-50%) scale(0.6); opacity: 0; }
  100% { transform: translateX(-50%) scale(1); opacity: 1; }
}
.leo-talk-bubble .bubble-tri {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 8px solid transparent;
  border-top-color: var(--orange);
}
.leo-talk-bubble .bubble-text {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.35;
}
.leo-talk-bubble .bubble-mouth {
  display: flex;
  gap: 3px;
  justify-content: center;
  margin-top: 6px;
}
.leo-talk-bubble .bubble-mouth span {
  width: 5px;
  height: 5px;
  background: var(--orange);
  border-radius: 50%;
  animation: mouthDot 0.5s ease-in-out infinite;
}
.leo-talk-bubble .bubble-mouth span:nth-child(2) { animation-delay: 0.15s; }
.leo-talk-bubble .bubble-mouth span:nth-child(3) { animation-delay: 0.3s; }
@keyframes mouthDot {
  0%, 100% { transform: scale(0.6); opacity: 0.5; }
  50% { transform: scale(1.3); opacity: 1; }
}

/* ===== 启动欢迎页 ===== */
#splash-screen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(160deg, #FF8C42 0%, #FFB800 50%, #FF6B9D 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
#splash-screen.hidden {
  opacity: 0;
  transform: scale(1.1);
  pointer-events: none;
}
.splash-logo {
  width: 140px; height: 140px;
  border-radius: 32px;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.2);
  margin-bottom: 24px;
  animation: splashBounce 2s ease-in-out infinite;
  overflow: hidden;
}
.splash-logo img { width: 100%; height: 100%; object-fit: cover; }
@keyframes splashBounce {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-12px) rotate(2deg); }
}
.splash-title {
  font-family: Fredoka;
  font-size: 32px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  margin-bottom: 8px;
}
.splash-sub {
  font-size: 15px;
  color: rgba(255,255,255,0.9);
  margin-bottom: 36px;
  font-weight: 600;
}
.splash-start-btn {
  background: #fff;
  color: #FF8C42;
  border: none;
  padding: 16px 48px;
  border-radius: 28px;
  font-size: 20px;
  font-weight: 700;
  font-family: Fredoka;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  transition: transform 0.15s, box-shadow 0.15s;
  animation: pulseBtn 1.8s ease-in-out infinite;
}
.splash-start-btn:active { transform: scale(0.95); }
@keyframes pulseBtn {
  0%, 100% { box-shadow: 0 6px 20px rgba(0,0,0,0.15), 0 0 0 0 rgba(255,255,255,0.5); }
  50% { box-shadow: 0 6px 20px rgba(0,0,0,0.15), 0 0 0 16px rgba(255,255,255,0); }
}
.splash-hint {
  margin-top: 20px;
  font-size: 12px;
  color: rgba(255,255,255,0.7);
}

/* ===== 安装应用按钮 ===== */
.install-banner {
  margin: 0 16px 16px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
}
.install-banner .install-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: rgba(255,255,255,0.2);

}
.install-banner .install-text {
  flex: 1;
  color: #fff;
}
.install-banner .install-text .t1 { font-size: 14px; font-weight: 700; }

.install-banner .install-btn {
  background: #fff;
  color: #764ba2;
  border: none;
  padding: 8px 16px;
  border-radius: 20px;

/* standalone 模式优化 */
@media (display-mode: standalone) {
  #app { padding-top: env(safe-area-inset-top); }
  body { overscroll-behavior: none; }
}

/* 响应式 */
@media (min-width: 520px) {
  #app { box-shadow: 0 0 40px rgba(0,0,0,0.06); }
}

.phoneme-tab.active {

.phoneme-detail .example-word .word-zh {
  font-size: 13px;
  color: var(--text-light);
}
.phoneme-detail .action-row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}
.phoneme-detail .action-row .btn { flex: 1; }
.phoneme-detail .learned-btn {
  background: var(--green);
  color: #fff;
}
.phoneme-progress {
  padding: 0 16px 16px;
}
.phoneme-progress .bar {
  height: 10px;
  background: var(--bg-soft);
  border-radius: 5px;
  overflow: hidden;
  margin-top: 6px;
}
.phoneme-progress .fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 5px;
  transition: width 0.5s ease;
}
/* 更多例词 chips */
.phoneme-detail .extra-words {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: -4px 0 14px;
}
.phoneme-detail .extra-word-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  border: 2px solid var(--bg-soft);
  border-radius: 999px;
  padding: 6px 12px 6px 6px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s ease;
}
.phoneme-detail .extra-word-chip:active {
  transform: scale(0.92);
  background: var(--bg-soft);
}
.phoneme-detail .extra-word-chip .ew-zh {
  font-size: 11px;
  color: var(--text-light);
  font-weight: 600;
}
.phoneme-detail .extra-word-chip.playing {
  border-color: var(--green);
  background: #f0fdf4;
}
/* 辨音挑战 */
.phoneme-detail .quiz-block {
  background: linear-gradient(135deg, #fdf6ec, #fef9ef);
  border: 2px dashed #F5C97B;
  border-radius: 18px;
  padding: 14px 14px 16px;
  margin: 0 0 14px;
  text-align: center;
}
.phoneme-detail .quiz-title {
  font-size: 15px;
  font-weight: 800;
  color: #B7791F;
}
.phoneme-detail .quiz-desc {
  font-size: 12px;
  color: #A07C3C;
  font-weight: 600;
  margin-top: 2px;
}
.phoneme-detail .quiz-options {
  display: flex;
  justify-content: center;
  gap: 14px;
}
.phoneme-detail .quiz-opt {
  width: 86px;
  height: 66px;
  border-radius: 16px;
  background: #fff;
  border: 3px solid #ddd;
  font-size: 26px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.phoneme-detail .quiz-opt:active {
  transform: scale(0.9);
}
.phoneme-detail .quiz-opt.shake {
  animation: quizShake 0.4s ease;
  border-color: #E74C3C !important;
  color: #E74C3C !important;
}
@keyframes quizShake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-4px); }
}
.phoneme-detail .quiz-ok {
  background: #f0fdf4;
  border: 2px solid var(--green);
  color: var(--green);
  border-radius: 12px;
  padding: 10px;
  font-size: 14px;
  font-weight: 800;
  margin-top: 10px;
  animation: popIn 0.3s ease;
}
.phoneme-detail .quiz-no {
  color: #E74C3C;
  font-size: 13px;
  font-weight: 700;
  margin-top: 8px;
}
@keyframes popIn {
  0% { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

  if (realAudio) { try { realAudio.pause(); } catch(e) {} }
  var a = audioCache[url];
  if (!a) {
    a = new Audio(url);
    a.preload = "auto";
    audioCache[url] = a;
  }
  realAudio = a;
  try { a.currentTime = 0; } catch(e) {}
  a.volume = 1.0;
  var onEnded = function() { if (cb) cb(); a.removeEventListener('ended', onEnded); };
  a.addEventListener('ended', onEnded);
  a.play().catch(function() { if (cb) cb(); });
  return a;
}

// 预加载音频（进入页面时调用，让后续点击秒播）
function preloadAudio(url) {
  if (!url || audioCache[url]) return;
  var a = new Audio(url);
  a.preload = "auto";
  audioCache[url] = a;
}

// 播放音标本尊：优先AI真人纯音，回退例词MP3，再回退合成器
function playPhonemePure(p) {
  if (p.sound) { playRealAudio(p.sound); return; }
  if (p.audio) { playRealAudio(p.audio); return; }
  playPhonemeSoundSynth(p);
}

// 单词真人发音：优先MP3，失败回退TTS
function speakWord(word, opts) {
  opts = opts || {};
  var w = (typeof word === 'string' ? word : word.en).toLowerCase();
  var url = 'audio/words/' + w + '.mp3';
  // 检查文件是否存在（通过尝试播放，error时回退）
  var a = new Audio(url);
  a.addEventListener('canplaythrough', function() {
    playRealAudio(url, opts.onEnd);
  });
  a.addEventListener('error', function() {
    // MP3不存在，回退TTS
    speak(typeof word === 'string' ? word : word.en, { rate: opts.rate || 0.78, onend: opts.onEnd });
  });
  a.load();
}

// ===== 音素合成器：直接用 Web Audio 合成音素发音 =====
// 原理：元音用 formant（共振峰）合成；辅音用噪声+滤波+爆破
function synthNoiseBuffer(ctx, dur) {
  var sr = ctx.sampleRate;
  var buf = ctx.createBuffer(1, Math.max(1, Math.floor(sr * dur)), sr);
  var data = buf.getChannelData(0);
  for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}

function synthVowelFormant(snd) {
  var ctx = ensureAudio();
  if (!ctx) return;
  var t0 = ctx.currentTime + 0.02;
  var dur = snd.dur || 0.4;
  var master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  // 人声基频（儿童偏高一点）
  var f0 = 190;
  // 基频 + 两个共振峰 近似人声元音
  var comps = [[f0, 0.55], [snd.f1, 0.32], [snd.f2, 0.13]];
  if (snd.r) comps.push([2500, 0.08]); // r化音色
  comps.forEach(function(pp) {
    var o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = pp[0];
    var g = ctx.createGain();
    g.gain.value = pp[1];
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  });
  master.gain.setValueAtTime(0, t0);
  master.gain.linearRampToValueAtTime(0.75, t0 + 0.04);
  master.gain.setValueAtTime(0.75, t0 + dur - 0.06);
  master.gain.linearRampToValueAtTime(0.001, t0 + dur);
}

function synthGlideFormant(snd) {
  var ctx = ensureAudio();
  if (!ctx) return;
  var t0 = ctx.currentTime + 0.02;
  var dur = snd.dur || 0.45;
  var master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  var f0 = 190;
  var comps = [
    { base: f0, g: 0.55 },
    { base: snd.f1, g: 0.32 },
    { base: snd.f2, g: 0.13 }
  ];
  comps.forEach(function(pp, idx) {
    var o = ctx.createOscillator();
    o.type = 'sine';
    var freq = pp.base;
    var g = ctx.createGain();
    g.gain.value = pp.g;
    o.connect(g); g.connect(master);
    o.start(t0);
    o.frequency.setValueAtTime(pp.base[0] || pp.base, t0);
    o.frequency.linearRampToValueAtTime(pp.base[1] || pp.base, t0 + dur);
    o.stop(t0 + dur + 0.05);
  });
  master.gain.setValueAtTime(0, t0);
  master.gain.linearRampToValueAtTime(0.7, t0 + 0.04);
  master.gain.setValueAtTime(0.7, t0 + dur - 0.06);
  master.gain.linearRampToValueAtTime(0.001, t0 + dur);
}

function synthFricative(snd) {
  var ctx = ensureAudio();
  if (!ctx) return;
  var t0 = ctx.currentTime + 0.02;
  var dur = snd.dur || 0.28;
  var master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  var src = ctx.createBufferSource();
  src.buffer = synthNoiseBuffer(ctx, dur + 0.1);
  var bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = snd.freq;
  bp.Q.value = 1.2;
  src.connect(bp); bp.connect(master);
  src.start(t0);
  master.gain.setValueAtTime(0, t0);
  master.gain.linearRampToValueAtTime(snd.voiced ? 0.55 : 0.5, t0 + 0.04);
  master.gain.setValueAtTime(0.5, t0 + dur - 0.05);
  master.gain.linearRampToValueAtTime(0.001, t0 + dur);
  if (snd.voiced) {
    var v = ctx.createOscillator();
    v.type = 'sine';
    v.frequency.value = 150;
    var vg = ctx.createGain();
    vg.gain.value = 0.25;
    v.connect(vg); vg.connect(master);
    v.start(t0); v.stop(t0 + dur + 0.05);
  }
}

function synthPlosive(snd) {
  var ctx = ensureAudio();
  if (!ctx) return;
  var t0 = ctx.currentTime + 0.02;
  var master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  // 爆破噪声（短促）
  var src = ctx.createBufferSource();
  src.buffer = synthNoiseBuffer(ctx, 0.09);
  var bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = snd.place === 'lip' ? 1200 : snd.place === 'alveolar' ? 3000 : 2500;
  bp.Q.value = 1.5;
  src.connect(bp); bp.connect(master);
  src.start(t0);
  master.gain.setValueAtTime(0, t0);
  master.gain.linearRampToValueAtTime(0.8, t0 + 0.015);
  master.gain.exponentialRampToValueAtTime(0.001, t0 + 0.09);
  if (snd.voiced) {
    var v = ctx.createOscillator();
    v.type = 'sine';
    v.frequency.value = 130;
    var vg = ctx.createGain();
    vg.gain.value = 0.22;
    v.connect(vg); vg.connect(master);
    v.start(t0); v.stop(t0 + 0.15);
  }
}

function synthNasal(snd) {
  var ctx = ensureAudio();
  if (!ctx) return;
  var t0 = ctx.currentTime + 0.02;
  var dur = snd.dur || 0.3;
  var master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  var o = ctx.createOscillator();
  o.type = 'sine';
  o.frequency.value = snd.f;
  var o2 = ctx.createOscillator();
  o2.type = 'sine';
  o2.frequency.value = snd.f2;
  var g = ctx.createGain(); g.gain.value = 0.5;
  var g2 = ctx.createGain(); g2.gain.value = 0.3;
  o.connect(g); g.connect(master);
  o2.connect(g2); g2.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
  o2.start(t0); o2.stop(t0 + dur + 0.05);
  // 鼻音哼鸣感：轻微噪声
  var src = ctx.createBufferSource();
  src.buffer = synthNoiseBuffer(ctx, dur + 0.1);
  var lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 800;
  var ng = ctx.createGain(); ng.gain.value = 0.12;
  src.connect(lp); lp.connect(ng); ng.connect(master);
  src.start(t0);
  master.gain.setValueAtTime(0, t0);
  master.gain.linearRampToValueAtTime(0.65, t0 + 0.05);
  master.gain.setValueAtTime(0.65, t0 + dur - 0.05);
  master.gain.linearRampToValueAtTime(0.001, t0 + dur);
}

function synthApproximant(snd) {
  // 近似音 l：先元音化再收
  var ctx = ensureAudio();
  if (!ctx) return;
  var t0 = ctx.currentTime + 0.02;
  var dur = snd.dur || 0.3;
  var master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  var f0 = 180;
  var comps = [[f0, 0.5], [snd.f1, 0.32], [snd.f2, 0.18]];
  comps.forEach(function(pp) {
    var o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = pp[0];
    var g = ctx.createGain();
    g.gain.value = pp[1];
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  });
  master.gain.setValueAtTime(0, t0);
  master.gain.linearRampToValueAtTime(0.6, t0 + 0.05);
  master.gain.setValueAtTime(0.6, t0 + dur - 0.05);
  master.gain.linearRampToValueAtTime(0.001, t0 + dur);
}

function synthAffricate(snd) {
  // tʃ / dʒ：爆破+摩擦
  var ctx = ensureAudio();
  if (!ctx) return;
  var t0 = ctx.currentTime + 0.02;
  var dur = snd.dur || 0.32;
  var master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  // 爆破段
  var src = ctx.createBufferSource();
  src.buffer = synthNoiseBuffer(ctx, 0.06);
  var bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2500;
  bp.Q.value = 1.5;
  src.connect(bp); bp.connect(master);
  src.start(t0);
  master.gain.setValueAtTime(0, t0);
  master.gain.linearRampToValueAtTime(0.7, t0 + 0.015);
  master.gain.linearRampToValueAtTime(0.5, t0 + 0.06);
  // 摩擦段
  var src2 = ctx.createBufferSource();
  src2.buffer = synthNoiseBuffer(ctx, dur);
  var bp2 = ctx.createBiquadFilter();
  bp2.type = 'bandpass';
  bp2.frequency.value = 3200;
  bp2.Q.value = 1.0;
  var g2 = ctx.createGain(); g2.gain.value = 0.5;
  src2.connect(bp2); bp2.connect(g2); g2.connect(master);
  src2.start(t0 + 0.05);
  if (snd.voiced) {
    var v = ctx.createOscillator();
    v.type = 'sine';
    v.frequency.value = 140;
    var vg = ctx.createGain();
    vg.gain.value = 0.2;
    v.connect(vg); vg.connect(master);
    v.start(t0); v.stop(t0 + dur + 0.05);
  }
  master.gain.setValueAtTime(0, t0);
  master.gain.linearRampToValueAtTime(0.6, t0 + 0.03);
  master.gain.setValueAtTime(0.6, t0 + dur - 0.06);
  master.gain.linearRampToValueAtTime(0.001, t0 + dur);
}

// 音素总入口：播放音标本身的发音
function playPhonemeSoundSynth(p) {
  ensureAudio();
  var snd = p.snd || { t: 'vowel', f1: 500, f2: 1500, dur: 0.35 };
  switch (snd.t) {
    case 'vowel': synthVowelFormant(snd); break;
    case 'glide': synthGlideFormant(snd); break;
    case 'fric': synthFricative(snd); break;
    case 'plosive': synthPlosive(snd); break;
    case 'nasal': synthNasal(snd); break;
    case 'approx': synthApproximant(snd); break;
    case 'affricate': synthAffricate(snd); break;
    default: synthVowelFormant(snd);
  }
}

// ===== Web Audio 音效与旋律引擎 =====
const NOTE_FREQ = {
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.26, F5:698.46, G5:783.99, A5:880.00, B5:987.77,
  C6:1046.50, D6:1174.66, E6:1318.51, G6:1567.98
};
var audioCtx = null;
var melodyNodes = [];
var melodyTimers = [];
var songStopRequested = false;

function ensureAudio() {
  if (!audioCtx) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// 播放单个音符（音乐盒音色）
function playNote(freq, startTime, dur, vol) {
  var ctx = ensureAudio();
  if (!ctx) return;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  // 两层振荡器增加音乐盒明亮感
  var osc2 = ctx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2;
  var gain2 = ctx.createGain();
  gain2.gain.value = vol * 0.25;
  osc2.connect(gain2);
  gain2.connect(gain);
  osc.connect(gain);
  gain.connect(ctx.destination);
  var t = startTime;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.start(t);
  osc2.start(t);
  osc.stop(t + dur + 0.05);
  osc2.stop(t + dur + 0.05);
  melodyNodes.push(osc, osc2);
}

// 播放一行儿歌旋律，notes 如 "C4 C4 G4 G4 A4 A4 G4:2"
function playLineMelody(notesStr, cb) {
  var ctx = ensureAudio();
  if (!ctx) { if (cb) cb(); return; }
  var notes = notesStr.trim().split(/\s+/);
  var t = ctx.currentTime + 0.08;
  var BEAT = 0.36; // 八分音符时长
  notes.forEach(function(n) {
    var parts = n.split(':');
    var freq = NOTE_FREQ[parts[0]];
    var mult = parseInt(parts[1]) || 1;
    if (!freq) return;
    playNote(freq, t, BEAT * mult * 0.95, 0.16);
    t += BEAT * mult;
  });
  var totalMs = (t - ctx.currentTime - 0.08) * 1000;
  var timer = setTimeout(function() {
    melodyTimers = melodyTimers.filter(function(x) { return x !== timer; });
    if (cb) cb();
  }, totalMs + 60);
  melodyTimers.push(timer);
}

// ===== 合成人声哼唱模式：让儿歌真正"唱"出来 =====
// 每个音符用元音化 formant 音色 + 轻微颤音发声，模拟小朋友哼唱
function singNote(freq, startTime, dur, vol) {
  var ctx = ensureAudio();
  if (!ctx) return;
  var t = startTime;
  var master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  // 人声化：基频 + 两个共振峰（模拟"啊"的口型）+ 颤音
  var comps = [
    [freq, 0.5],
    [freq * 1.62, 0.2],
    [freq * 2.44, 0.12]
  ];
  comps.forEach(function(pp) {
    var o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = pp[0];
    // 轻微颤音（vibrato），更像唱歌
    var vib = ctx.createOscillator();
    vib.type = 'sine';
    vib.frequency.value = 5.5;
    var vibGain = ctx.createGain();
    vibGain.gain.value = freq * 0.012;
    vib.connect(vibGain); vibGain.connect(o.frequency);
    var g = ctx.createGain();
    g.gain.value = pp[1];
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
    vib.start(t); vib.stop(t + dur + 0.05);
  });
  master.gain.setValueAtTime(0, t);
  master.gain.linearRampToValueAtTime(vol, t + 0.035);
  master.gain.setValueAtTime(vol * 0.92, t + dur - 0.12);
  master.gain.exponentialRampToValueAtTime(0.001, t + dur);
  melodyNodes.push(master);
}

// 用哼唱模式播放一行旋律（真正像唱歌）
function playLineSing(notesStr, cb) {
  var ctx = ensureAudio();
  if (!ctx) { if (cb) cb(); return; }
  var notes = notesStr.trim().split(/\s+/);
  var t = ctx.currentTime + 0.08;
  var BEAT = 0.36;
  notes.forEach(function(n) {
    var parts = n.split(':');
    var freq = NOTE_FREQ[parts[0]];
    var mult = parseInt(parts[1]) || 1;
    if (!freq) return;
    singNote(freq, t, BEAT * mult * 0.98, 0.17);
    // 哼唱时叠加一层轻柔音乐盒伴奏
    playNote(freq, t, BEAT * mult * 0.9, 0.05);
    t += BEAT * mult;
  });
  var totalMs = (t - ctx.currentTime - 0.08) * 1000;
  var timer = setTimeout(function() {
    melodyTimers = melodyTimers.filter(function(x) { return x !== timer; });
    if (cb) cb();
  }, totalMs + 80);
  melodyTimers.push(timer);
}

// ===== 唱歌词：歌词单词按旋律节拍唱出（真正的"唱"，有旋律有节奏）=====
// 简单音节元音映射：单词 -> 其核心元音的 formant
var SING_VOWEL = {
  'a':  { f1: 660, f2: 1720 }, 'e': { f1: 530, f2: 1840 },
  'i':  { f1: 390, f2: 1990 }, 'o': { f1: 570, f2: 840 },
  'u':  { f1: 440, f2: 1020 }, 'ə': { f1: 500, f2: 1500 }
};
function wordVowelFmts(word) {
  // 取单词里第一个响亮元音字母
  var w = word.toLowerCase().replace(/[^a-z]/g, '');
  if (!w) return SING_VOWEL['ə'];
  var m = w.match(/[aeiou]/);
  if (!m) return SING_VOWEL['ə'];
  var c = m[0];
  // 常见组合优化
  if (w.indexOf('ee') !== -1 || w.indexOf('ea') !== -1) return SING_VOWEL['i'];
  if (w.indexOf('oo') !== -1) return SING_VOWEL['u'];
  if (w.indexOf('ou') !== -1 || w.indexOf('ow') !== -1) return SING_VOWEL['a'];
  if (w.indexOf('ai') !== -1 || w.indexOf('ay') !== -1) return SING_VOWEL['e'];
  if (w.indexOf('oa') !== -1) return SING_VOWEL['o'];
  return SING_VOWEL[c] || SING_VOWEL['ə'];
}

// 唱一个单词（用该词元音口型 + 旋律音高）
function singWord(freq, startTime, dur, vol, word) {
  var ctx = ensureAudio();
  if (!ctx) return;
  var t = startTime;
  var fmts = wordVowelFmts(word);
  var master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  // 基频 + 该单词元音的共振峰（近似人声唱词）
  var comps = [
    [freq, 0.42],
    [freq * 1.2, 0.18],
    [freq * 1.5, 0.12]
  ];
  // 用 formant 偏移模拟不同元音
  var f1r = fmts.f1 / 660, f2r = fmts.f2 / 1720;
  comps.forEach(function(pp, idx) {
    var o = ctx.createOscillator();
    o.type = 'sine';
    var base = pp[0];
    if (idx === 1) base = freq * (0.8 + 0.6 * f1r);
    if (idx === 2) base = freq * (1.2 + 0.9 * f2r);
    o.frequency.value = base;
    var g = ctx.createGain();
    g.gain.value = pp[1];
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  });
  master.gain.setValueAtTime(0, t);
  master.gain.linearRampToValueAtTime(vol, t + 0.03);
  master.gain.setValueAtTime(vol * 0.9, t + dur - 0.1);
  master.gain.exponentialRampToValueAtTime(0.001, t + dur);
  melodyNodes.push(master);
}

// 唱一行歌词：单词对齐旋律音符（每词一个音符，长词占多音符）
function singLyricLine(line, notesStr, onWord, cb) {
  var ctx = ensureAudio();
  if (!ctx) { if (cb) cb(); return; }
  var words = line.replace(/[^\w\s']/g, '').trim().split(/\s+/).filter(Boolean);
  var notes = notesStr.trim().split(/\s+/);
  var BEAT = 0.36;
  var t = ctx.currentTime + 0.08;
  var totalBeats = 0;
  notes.forEach(function(n) {
    var parts = n.split(':');
    totalBeats += parseInt(parts[1]) || 1;
  });
  // 把音符分配给单词：总音符数/单词数，每词至少1个
  var wordNotes = [];
  var wi = 0;
  for (var i = 0; i < notes.length; i++) {
    if (!wordNotes[wi]) wordNotes[wi] = [];
    wordNotes[wi].push(notes[i]);
    // 按比例分配：单词少的词多给音符
    var avg = notes.length / words.length;
    if (wordNotes[wi].length >= Math.max(1, Math.round(avg)) && wi < words.length - 1) wi++;
  }
  if (wordNotes.length > words.length) wordNotes = wordNotes.slice(0, words.length);
  var wordIdx = 0;
  words.forEach(function(word, wii) {
    var nGroup = wordNotes[wii] || [];
    if (!nGroup.length) return;
    var groupDur = 0;
    nGroup.forEach(function(n) {
      var parts = n.split(':');
      groupDur += BEAT * (parseInt(parts[1]) || 1);
    });
    var start = t;
    // 该词内每个音符唱一次
    var acc = 0;
    nGroup.forEach(function(n) {
      var parts = n.split(':');
      var freq = NOTE_FREQ[parts[0]];
      var mult = parseInt(parts[1]) || 1;
      if (!freq) { acc += BEAT * mult; return; }
      var dur = BEAT * mult * 0.96;
      singWord(freq, start + acc, dur, 0.16, word);
      playNote(freq, start + acc, dur, 0.04);
      acc += BEAT * mult;
    });
    t += groupDur;
    if (onWord) onWord(wii);
  });
  var totalMs = (t - ctx.currentTime - 0.08) * 1000;
  var timer = setTimeout(function() {
    melodyTimers = melodyTimers.filter(function(x) { return x !== timer; });
    if (cb) cb();
  }, totalMs + 100);
  melodyTimers.push(timer);
}

function estimateMelodyMs(notesStr) {
  if (!notesStr) return 0;
  var BEAT = 360;
  var total = 0;
  notesStr.trim().split(/\s+/).forEach(function(n) {
    var parts = n.split(':');
    if (!NOTE_FREQ[parts[0]]) return;
    total += BEAT * (parseInt(parts[1]) || 1);
  });
  return total;
}

var songAudio = null;
function stopMelody() {
  songStopRequested = true;
  melodyTimers.forEach(clearTimeout);
  melodyTimers = [];
  melodyNodes.forEach(function(n) {
    try { n.stop(); } catch (e) {}
    try { n.disconnect(); } catch (e) {}
  });
  melodyNodes = [];
  if (songAudio) {
    try { songAudio.pause(); songAudio.currentTime = 0; } catch(e) {}
  }
}

// 短促音效（点击/奖励反馈）
function sfxTone(freq, dur, type, vol) {
  var ctx = ensureAudio();
  if (!ctx) return;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  var t = ctx.currentTime;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol || 0.15, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + (dur || 0.12));
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + (dur || 0.12) + 0.05);
}

    log = { firstLearn: now, reviewCount: 0, nextReview: now + REVIEW_INTERVALS[0] * 86400000 };
    state.wordLearnLog[word] = log;
  }
  // 加入已学单词列表
  if (state.learnedWords.indexOf(word) === -1) {
    state.learnedWords.push(word);
  }
  saveState();
}

function markWordReviewed(word, correct) {
  var log = state.wordLearnLog[word];
  if (!log) { markWordLearned(word); return; }
  var now = Date.now();
  if (correct) {
    log.reviewCount = (log.reviewCount || 0) + 1;
    var idx = Math.min(log.reviewCount, REVIEW_INTERVALS.length - 1);
    log.nextReview = now + REVIEW_INTERVALS[idx] * 86400000;
  } else {
    // 答错了，缩短到1天后再复习
    log.reviewCount = Math.max(0, (log.reviewCount || 0) - 1);
    log.nextReview = now + 86400000;
  }
  saveState();
}

function getReviewWords() {
  var now = Date.now();
  var words = [];
  for (var w in state.wordLearnLog) {
    var log = state.wordLearnLog[w];
    if (log.nextReview && log.nextReview <= now && (log.reviewCount || 0) < REVIEW_INTERVALS.length) {
      words.push(w);
    }
  }
  return words;
}

function getTodayTopic() {

  var custom = state.customTopic;
  if (custom && TOPICS[custom]) {

function findLineAudio(text) {
  if (!text) return null;
  var low = String(text).toLowerCase();
  for (var i = 0; i < LINE_AUDIO.length; i++) {
    if (low.indexOf(LINE_AUDIO[i][0].toLowerCase()) !== -1) {
      return LINE_AUDIO[i][1];
    }
  }
  return null;
}

function speak(text, opts) {
  opts = opts || {};
  // 优先播放真人配音（命中即不走TTS）
  var lineUrl = findLineAudio(text);
  if (lineUrl) {
    if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch(e) {} }
    playRealAudio(lineUrl, opts.onend);
    return { _realAudio: true };
  }
  if (!('speechSynthesis' in window)) return;
  // 安卓/PWA standalone 模式下需要先 resume，否则可能静音
  try { window.speechSynthesis.resume(); } catch(e) {}
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = opts.lang || 'en-US';
  // 语气优化：基础语速+随机呼吸感微调，避免机械感
  var baseRate = opts.rate || 0.82;
  if (!opts.rate) baseRate = 0.82 + (Math.random() * 0.05 - 0.025);
  utter.rate = baseRate;
  utter.pitch = opts.pitch || (1.05 + Math.random() * 0.15);
  utter.volume = opts.volume || 1;
  var isZh = opts.lang && opts.lang.indexOf('zh') !== -1;
  var voice = isZh ? bestZhVoice : bestEnVoice;
  if (voice) {
    utter.voice = voice;
  } else if (!isZh) {
    // 设备没有英语语音时，回退到系统默认语音（至少有声音）
    utter.lang = 'en-US';
  }
  utter.onerror = function(e) {
    // 被 interrupted/canceled 时静默忽略，其他错误重试一次
    if (e.error !== 'interrupted' && e.error !== 'canceled') {
      setTimeout(function() {
        try {
          var u2 = new SpeechSynthesisUtterance(text);
          u2.lang = opts.lang || 'en-US';
          u2.rate = opts.rate || 0.82;
          u2.pitch = opts.pitch || 1.1;
          if (voice) u2.voice = voice;
          window.speechSynthesis.speak(u2);
        } catch(err) {}
      }, 100);
    }
  };
  // cancel 是异步的，延迟一点再 speak，避免新语音被取消
  window.speechSynthesis.cancel();
  setTimeout(function() {
    try {
      window.speechSynthesis.resume();
      window.speechSynthesis.speak(utter);
    } catch(e) {}
  }, 60);
  return utter;
}

// ===== 情绪化说话引擎：拆短句+动态音高语速，模拟真人抑扬顿挫 =====
// segments: 字符串数组或 [{t:文本, r:语速, p:音高, d:停顿ms}]
var emoSpeaking = false;
var emoCanceled = false;
function speakEmo(textOrSegs, opts) {
  opts = opts || {};
  if (!('speechSynthesis' in window)) return;
  var segs;
  if (typeof textOrSegs === 'string') {
    // 自动按标点拆句
    var raw = textOrSegs.replace(/([。！？!?，,])/g, '$1|').split('|').filter(function(x){return x.trim();});
    segs = raw.map(function(s) { return { t: s.trim(), r: opts.rate || 0.85, p: opts.pitch || 1.05, d: 90 }; });
    // 制造起伏：首句稍慢、中句正常、末句活泼
    segs.forEach(function(s, i) {
      if (i === 0) { s.r = (opts.rate || 0.8); s.p = 1.0; }
      else if (i === segs.length - 1) { s.r = (opts.rate || 0.9) + 0.08; s.p = 1.25; }
      else { s.r = (opts.rate || 0.85); s.p = 1.05 + (i % 2) * 0.15; }
    });
  } else {
    segs = textOrSegs.slice();
  }
  emoCanceled = false;
  emoSpeaking = true;
  var idx = 0;
  var isZh = opts.lang && opts.lang.indexOf('zh') !== -1;
  function playNext() {
    if (emoCanceled) { emoSpeaking = false; return; }
    if (idx >= segs.length) { emoSpeaking = false; return; }
    var seg = segs[idx];
    idx++;
    var u = speak(seg.t, { lang: opts.lang || 'zh-CN', rate: seg.r, pitch: seg.p, volume: opts.volume || 1 });
    var delay = (seg.d || 80);
    if (u && u.onend !== undefined) {
      u.onend = function() { setTimeout(playNext, delay); };
    } else {
      setTimeout(playNext, Math.max(delay, 500 + seg.t.length * 90));
    }
    // 兜底推进
    setTimeout(function() { if (idx <= segs.length && !emoCanceled) { emoSpeaking = false; playNext(); } }, 2600);
  }
  playNext();
}
function stopEmo() {
  emoCanceled = true;
  emoSpeaking = false;
  window.speechSynthesis && window.speechSynthesis.cancel();
}

// ===== 跟读评分 =====
function startReadingPractice(targetWord, callback) {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    callback({ supported: false });
    return;
  }
  var rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  var done = false;
  rec.onresult = function(e) {
    if (done) return;
    done = true;
    var alternatives = [];
    for (var i = 0; i < e.results[0].length; i++) {
      alternatives.push(e.results[0][i].transcript.toLowerCase().trim());
    }
    var target = targetWord.toLowerCase().trim().replace(/[^\w\s]/g, '');
    var score = 1; // 保底鼓励分
    var bestMatch = "";
    for (var a = 0; a < alternatives.length; a++) {
      var t = alternatives[a].replace(/[^\w\s]/g, '');
      if (t === target) { score = 3; bestMatch = alternatives[a]; break; }
      if (t.indexOf(target) !== -1 || target.indexOf(t) !== -1) {
        if (score < 2) { score = 2; bestMatch = alternatives[a]; }
      }
      if (t.length > 0 && target.length > 0 && t.charAt(0) === target.charAt(0)) {
        if (score < 2) { score = 2; bestMatch = alternatives[a]; }
      }
    }
    if (!bestMatch && alternatives.length > 0) bestMatch = alternatives[0];
    callback({ supported: true, score: score, transcript: bestMatch });
  };
  rec.onerror = function() {
    if (done) return;
    done = true;
    callback({ supported: true, score: 0, error: true });
  };
  rec.onend = function() {
    if (!done) { done = true; callback({ supported: true, score: 0, error: true }); }
  };
  try { rec.start(); } catch(e) { callback({ supported: false }); }
}

// ===== 语音定制今日课程 =====
var voiceRecognition = null;
var voiceListening = false;

function isCustomToday() {
  return state.customTopic && state.customTopicDate === getTodayKey() && !!TOPICS[state.customTopic];
}

function setVoiceStatus(txt, cls) {
  var el = document.getElementById('voiceStatus');
  if (el) {
    el.textContent = txt;
    el.className = 'voice-status' + (cls ? ' ' + cls : '');
  }
}

function showToast(msg, cls) {
  var t = document.createElement('div');
  t.className = 'voice-toast' + (cls ? ' ' + cls : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.classList.add('show'); }, 10);
  setTimeout(function() { t.classList.remove('show'); setTimeout(function() { t.remove(); }, 400); }, 2600);
}

function startVoiceCustom() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setVoiceStatus('不支持录音', 'error');
    speakZh('哎呀，这个浏览器不能听我说话，请用手机自带的浏览器打开哦。');
    return;
  }
  if (voiceListening) { stopVoice(); return; }
  try {
    voiceRecognition = new SR();
    voiceRecognition.lang = 'zh-CN';
    voiceRecognition.interimResults = false;
    voiceRecognition.maxAlternatives = 3;

    var voiceBtn = document.getElementById('voiceBtn');
    voiceBtn.classList.add('listening');
    setVoiceStatus('我在听…', '');
    voiceListening = true;
    sfxClick();

    voiceRecognition.onresult = function(e) {
      var text = '';
      for (var i = 0; i < e.results.length; i++) {
        if (e.results[i].isFinal) text += e.results[i][0].transcript;
      }
      handleVoiceCommand(text.trim());
    };
    voiceRecognition.onerror = function(e) {
      stopVoice();
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        setVoiceStatus('没权限', 'error');
        speakZh('麦克风没有打开，请允许使用麦克风，再试一次。');
      } else if (e.error === 'no-speech') {
        setVoiceStatus('没听到', 'error');
        speakZh('我没听清，再试一次吧！');
      } else {
        setVoiceStatus('再试一次', 'error');
      }
    };
    voiceRecognition.onend = function() {
      stopVoice();
      var el = document.getElementById('voiceStatus');
      if (el && el.textContent === '我在听…') {
        setVoiceStatus('没听到', 'error');
        speakZh('我没听清，再试一次吧！');
      }
    };

    voiceRecognition.start();
  } catch(err) {
    stopVoice();
    setVoiceStatus('出错了', 'error');
  }
}

function stopVoice() {
  voiceListening = false;
  var btn = document.getElementById('voiceBtn');
  if (btn) btn.classList.remove('listening');
  if (voiceRecognition) {
    try { voiceRecognition.stop(); } catch(e) {}
  }
}

function handleVoiceCommand(text) {
  stopVoice();
  if (!text) {
    setVoiceStatus('没听到', 'error');
    speakZh('我没听清，再说一次吧！');
    return;
  }
  setVoiceStatus('听到啦', 'ok');

  // 关键词 → 主题映射
  var rules = [
    { keys: ['颜色', '色彩', '红色', '蓝色'], topic: 'colors' },
    { keys: ['动物', '小动物', '猫', '狗'], topic: 'animals' },
    { keys: ['食物', '水果', '苹果', '吃饭'], topic: 'food' },
    { keys: ['数字', '数数', '一二三', '123'], topic: 'numbers' },
    { keys: ['身体', '五官', '头', '手'], topic: 'body' },
    { keys: ['家人', '家庭', '爸爸', '妈妈'], topic: 'family' },
    { keys: ['问候', '打招呼', '你好'], topic: 'greetings' },
    { keys: ['交通', '车', '汽车', '公交车'], topic: 'transport' },
    { keys: ['动作', '动词', '跑', '跳', '玩'], topic: 'actions' },
    { keys: ['家居', '家里', '桌子', '椅子', '床', '电脑'], topic: 'home' },
    { keys: ['自然', '天气', '太阳', '月亮', '树'], topic: 'nature' },
  ];

  var matched = null;
  for (var i = 0; i < rules.length; i++) {
    for (var j = 0; j < rules[i].keys.length; j++) {
      if (text.indexOf(rules[i].keys[j]) !== -1) { matched = rules[i].topic; break; }
    }
    if (matched) break;
  }

  if (matched) {
    state.customTopic = matched;
    state.customTopicDate = getTodayKey();
    // 今天的完成状态重置（换主题后可以重新学）
    var todayKey = getTodayKey();
    var idx = state.completedDates.indexOf(todayKey);
    if (idx !== -1) state.completedDates.splice(idx, 1);
    saveState();
    var topic = TOPICS[matched];
    speakZh('好呀！今天我们学' + topic.name + '！一起加油！');
    // 庆祝小动画
    showToast('今天学：' + topic.name + '！', 'ok');
    render();
    updateNav();
  } else {
    setVoiceStatus('没听懂', 'error');
    // 推荐可学的主题
    var names = [];
    var keys = Object.keys(TOPICS);
    for (var k = 0; k < keys.length; k++) {
      if (k < 6) names.push(TOPICS[keys[k]].name);
    }
    speakZh('你可以说：我想学颜色、动物、食物、数字、身体、家人或者交通哦！');
    showToast('试试说：我想学颜色', '');
  }
}

  if (h < 14) return "中午好，小朋友";

}

function buildCalendar() {
  var now = new Date();
  var year = now.getFullYear();
  var month = now.getMonth();
  var firstDay = new Date(year, month, 1).getDay();
  if (firstDay === 0) firstDay = 7; // Monday=1
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  var html = '<div style="text-align:center;font-weight:700;font-size:14px;color:var(--text-light);margin-bottom:10px">' + year + '年' + monthNames[month] + '</div>';
  html += '<div class="cal-grid">';
  ['一','二','三','四','五','六','日'].forEach(function(d) {
    html += '<div class="cal-dow">' + d + '</div>';
  });
  for (var i = 1; i < firstDay; i++) {
    html += '<div class="cal-empty"></div>';
  }
  for (var d = 1; d <= daysInMonth; d++) {
    var key = year + "-" + (month+1) + "-" + d;
    var done = state.completedDates.indexOf(key) !== -1;
    var isToday = (d === now.getDate());
    html += '<div class="cal-day' + (done ? ' cal-done' : '') + (isToday ? ' cal-today' : '') + '">' + (done ? starSVG(14) : d) + '</div>';
  }
  html += '</div>';
  return html;
}

function buildAchievements() {
  var html = '';
  ACHIEVEMENTS.forEach(function(a) {
    var unlocked = a.check(state);
    html += '<div class="achievement' + (unlocked ? '' : ' locked') + '" title="' + a.name + '：' + a.desc + '">' +

}
